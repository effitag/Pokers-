<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felt Lab Hold'em Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Rubik:wght@400;500;700&family=Suez+One&display=swap">
<style>
/* Layout: brand + tab rail on top; trainers = felt table column + "coach" side column, stacking under 980px.
   Single committed dark look (a card room at night), so no light-theme blocks. */
:root{
  --ink:#0b1210;
  --panel:#111a17;
  --panel-2:#16211d;
  --line:#24332d;
  --text:#e8eee8;
  --muted:#8b9d94;
  --felt:#11654c;
  --felt-deep:#06301f;
  --rail:#2b1d13;
  --rail-edge:#4a3322;
  --brass:#d6aa58;
  --brass-ink:#1b1306;
  --good:#4fd39b;
  --okc:#80b8ff;
  --bad:#f06b5f;
  --raise:#d9604f;
  --call:#3f8fd6;
  --fold:#1b2622;
  --on-color:#ffffff;
  --card-face:#f5f2ea;
  --card-edge:#d9d3c4;
  --suit-s:#1c211f;
  --suit-h:#d23a3a;
  --suit-d:#2c6ad3;
  --suit-c:#1d8a4b;
  --back-a:#7a2430;
  --back-b:#5c1a24;
  --shadow:rgba(0,0,0,.45);
  --f-display:'Suez One','Rubik',Georgia,serif;
  --f-body:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--text)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.55}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{max-width:1320px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1;margin:0;letter-spacing:.01em}
.brand h1 span{color:var(--brass)}
.brand small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.logo{width:38px;height:38px;border-radius:50%;flex:none;background:repeating-conic-gradient(var(--brass) 0 22.5deg,var(--rail) 22.5deg 45deg);display:grid;place-items:center;box-shadow:0 2px 8px var(--shadow)}
.logo::after{content:"";width:24px;height:24px;border-radius:50%;background:var(--felt);border:2px solid var(--brass)}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs button{flex:1 1 auto;border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:14px;color:var(--muted);font-weight:500}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{background:var(--brass);color:var(--brass-ink)}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acc-pill{font-family:var(--f-mono);font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--muted)}
.acc-pill b{color:var(--text)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px}
.switch input{appearance:none;width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch input:checked{background:var(--brass)}
.switch input:checked::after{transform:translateX(-12px);background:var(--brass-ink)}

/* ---------- layout ---------- */
.trainer{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;align-items:start}
@media (max-width:980px){.trainer{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h3{margin:0 0 10px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.scn{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;white-space:nowrap}
.tag b{font-family:var(--f-mono);font-weight:600;color:var(--brass)}
.scn-title{font-family:var(--f-display);font-size:21px;font-weight:400;margin:0 0 0 6px;text-wrap:balance}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}
.plain{font-size:13.5px;color:var(--muted);margin:6px 0 0}

/* ---------- cards ---------- */
.card{--w:40px;width:var(--w);height:calc(var(--w)*1.42);border-radius:calc(var(--w)*.13);background:var(--card-face);border:1px solid var(--card-edge);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 6px var(--shadow);flex:none;animation:deal .28s ease-out;direction:ltr}
.card .cr{font-family:var(--f-mono);font-weight:600;font-size:calc(var(--w)*.44);letter-spacing:-.04em}
.card .cs{font-size:calc(var(--w)*.42);margin-top:calc(var(--w)*.03)}
.card.s0{color:var(--suit-s)}.card.s1{color:var(--suit-h)}.card.s2{color:var(--suit-d)}.card.s3{color:var(--suit-c)}
.card.sm{--w:24px}.card.md{--w:40px}.card.lg{--w:54px}
.card.back{background:repeating-linear-gradient(45deg,var(--back-a) 0 4px,var(--back-b) 4px 8px);border:2px solid var(--card-face)}
.card.slot{background:transparent;border:1.5px dashed rgba(255,255,255,.16);box-shadow:none;animation:none}
.card.dim{opacity:.55}
@keyframes deal{from{transform:translateY(-10px) rotate(-3deg)}to{transform:none}}
@media (max-width:640px){.card.lg{--w:40px}.card.md{--w:31px}}

/* ---------- table ---------- */
.table-wrap{padding:64px 6px 44px}
.table{position:relative;width:100%;aspect-ratio:16/9;direction:ltr}
@media (max-width:640px){.table{aspect-ratio:4/5}.table-wrap{padding:52px 2px 40px}}
.felt{position:absolute;inset:7% 6%;border-radius:999px;background:radial-gradient(ellipse at 50% 38%,var(--felt) 0%,var(--felt-deep) 78%);box-shadow:0 0 0 12px var(--rail),0 0 0 14px var(--rail-edge),0 18px 50px var(--shadow),inset 0 0 70px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.felt::before{content:"";position:absolute;inset:9%;border-radius:999px;border:1px solid rgba(255,255,255,.07)}
.center{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1}
.pot{direction:rtl;font-family:var(--f-mono);font-size:13px;background:rgba(0,0,0,.35);padding:3px 12px;border-radius:999px;color:var(--text)}
.pot b{color:var(--brass)}
.board{display:flex;gap:6px}
.table-note{font-size:12.5px;color:rgba(232,238,232,.75);text-align:center;max-width:260px;direction:rtl}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2;transition:opacity .2s}
.seat .cards{display:flex;gap:3px;min-height:4px}
.seat .cards .card:nth-child(2){margin-left:-12px;transform:rotate(5deg)}
.seat.hero .cards .card:nth-child(2){margin-left:-8px;transform:rotate(3deg)}
.plate{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 10px;text-align:center;min-width:64px;box-shadow:0 3px 10px var(--shadow);direction:rtl}
.plate b{display:block;font-size:12.5px;letter-spacing:.04em;white-space:nowrap}
.plate span{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.plate em{display:block;font-style:normal;font-size:10px;color:var(--brass);letter-spacing:.05em}
.seat.hero .plate{border-color:var(--brass);background:var(--panel-2)}
.seat.hero .plate b{color:var(--brass)}
.seat.folded{opacity:.38}
.seat.villain .plate{border-color:var(--raise)}
.seat.acting .plate{box-shadow:0 0 0 2px var(--brass),0 0 20px color-mix(in srgb,var(--brass) 55%,transparent)}
.bubble{font-family:var(--f-mono);font-size:11px;background:rgba(0,0,0,.6);border-radius:6px;padding:1px 7px;white-space:nowrap;direction:rtl;color:var(--text)}
.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:12px;background:rgba(0,0,0,.4);border-radius:999px;padding:2px 8px 2px 3px;z-index:1}
.chip{width:14px;height:14px;border-radius:50%;background:repeating-conic-gradient(var(--brass) 0 30deg,var(--on-color) 30deg 60deg);border:2px solid var(--brass)}
.dealer{position:absolute;top:-9px;left:-9px;width:20px;height:20px;border-radius:50%;background:var(--card-face);color:var(--suit-s);font-weight:700;font-size:11px;display:grid;place-items:center;box-shadow:0 2px 5px var(--shadow);z-index:1;font-style:normal}
@media (max-width:640px){.table-note{display:none}.plate{min-width:52px;padding:2px 6px}.plate b{font-size:11px}.plate span{font-size:10px}.plate em{display:none}.bubble{font-size:10px}}

/* ---------- actions ---------- */
.actions{display:flex;flex-direction:column;gap:12px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 120px;border:1px solid var(--line);background:var(--panel-2);padding:13px 14px;border-radius:12px;cursor:pointer;font-size:15.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s,background .15s,border-color .15s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn kbd{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);font-weight:500}
.btn.fold{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.fold:hover:not(:disabled){background:color-mix(in srgb,var(--bad) 14%,var(--panel-2))}
.btn.call{border-color:color-mix(in srgb,var(--call) 55%,var(--line))}
.btn.call:hover:not(:disabled){background:color-mix(in srgb,var(--call) 16%,var(--panel-2))}
.btn.raise{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.raise kbd{color:var(--brass-ink);opacity:.7}
.btn.raise:hover:not(:disabled){filter:brightness(1.08)}
.btn.next{background:var(--text);color:var(--ink);border-color:var(--text)}
.btn.next kbd{color:var(--ink);opacity:.6}
.sizer{display:flex;flex-direction:column;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.sizer-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;cursor:pointer;font-family:var(--f-mono);font-size:12.5px}
.presets button:hover{border-color:var(--brass);color:var(--brass)}
.sizer input[type=range],.calc input[type=range]{width:100%;accent-color:var(--brass);direction:ltr}
.amt{font-family:var(--f-mono);font-size:15px}
.amt b{color:var(--brass)}
.waiting{display:flex;align-items:center;gap:10px;justify-content:center;padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brass);margin:0 2px;animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- coach panels ---------- */
.verdict{display:flex;gap:12px;align-items:flex-start}
.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none;color:var(--ink)}
.badge.best{background:var(--good)}.badge.ok{background:var(--okc)}.badge.mistake{background:var(--bad)}
.verdict h4{margin:0;font-size:17px;font-weight:700}
.verdict h4.best{color:var(--good)}.verdict h4.ok{color:var(--okc)}.verdict h4.mistake{color:var(--bad)}
.verdict p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.reasons{margin:12px 0 0;padding:0 18px 0 0;display:flex;flex-direction:column;gap:7px;font-size:14px}
.reasons li::marker{color:var(--brass)}
.line-tag{display:inline-block;font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin-top:6px;color:var(--brass)}
.explain{display:flex;flex-direction:column;gap:12px;margin-top:12px;font-size:14px}
.ex-lbl{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:500}
.ex-bottom{font-size:15.5px;font-weight:500;line-height:1.45}
.ex-steps{margin:0;padding:0 20px 0 0;display:flex;flex-direction:column;gap:6px}
.ex-steps li::marker{color:var(--brass);font-family:var(--f-mono);font-size:12px}
.ex-example{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ex-rule{border:1px dashed color-mix(in srgb,var(--brass) 55%,var(--line));border-radius:10px;padding:10px 12px}
.ex-example p,.ex-rule p{margin:0}
.ex-alt{margin:0;color:var(--muted)}
.term{all:unset;cursor:help;border-bottom:1px dotted var(--brass);color:inherit}
.term:hover{color:var(--brass)}
.term:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(540px,calc(100% - 32px));background:var(--panel-2);border:1px solid var(--brass);border-radius:14px;padding:14px 16px 14px 44px;z-index:50;box-shadow:0 14px 44px var(--shadow);direction:rtl}
.sheet h4{margin:0;font-size:16px;color:var(--brass)}
.sheet p{margin:6px 0 0;font-size:14px}
.sheet .ex{color:var(--muted)}
.sheet .close{position:absolute;top:10px;left:10px;border:1px solid var(--line);background:var(--panel);border-radius:8px;width:28px;height:28px;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;align-items:baseline}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.eqbar{position:relative;height:12px;border-radius:999px;background:var(--fold);overflow:visible;margin:10px 0 4px;direction:ltr}
.eqbar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--call),var(--good));transition:width .4s}
.eqbar u{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--brass);text-decoration:none}
.eqlegend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}
.bignum{font-family:var(--f-mono);font-size:30px;font-weight:600;line-height:1.1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.mini-cards{display:flex;gap:3px;flex-wrap:wrap;direction:ltr;justify-content:flex-end}
.outs-group{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:6px;border-top:1px solid var(--line);font-size:13.5px}
details.explain-box{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:13.5px}
details.explain-box summary{cursor:pointer;color:var(--brass);font-weight:500}
details.explain-box p{margin:8px 0 0;color:var(--muted)}
.hidden-note{font-size:13.5px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:12px;text-align:center}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13.5px;max-height:260px;overflow:auto}
.log li{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.log .st{font-weight:700;color:var(--brass);font-size:12px;letter-spacing:.05em}
.log .hero{color:var(--text);font-weight:500}
.log .vil{color:var(--muted)}
.log .res{color:var(--brass)}
.result{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.result .net{font-family:var(--f-mono);font-size:20px;font-weight:600}
.pos-net{color:var(--good)}.neg-net{color:var(--bad)}

/* ---------- range grid ---------- */
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;direction:ltr;width:100%}
.cell{aspect-ratio:1;border:0;padding:0;border-radius:3px;background:var(--fold);color:var(--muted);font-family:var(--f-mono);font-size:clamp(7.5px,1.05vw,12px);display:flex;align-items:center;justify-content:center;cursor:default;position:relative;min-width:0;overflow:hidden}
.grid.clickable .cell{cursor:pointer}
.cell.r{background:var(--raise);color:var(--on-color)}
.cell.c{background:var(--call);color:var(--on-color)}
.cell.hl{outline:2px solid var(--brass);outline-offset:1px;z-index:2}
.cell.pk{box-shadow:inset 0 0 0 2px var(--on-color)}
.grid.compact{gap:1px}
.grid.compact .cell{font-size:0;border-radius:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:500}
.seg button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:color-mix(in srgb,var(--brass) 10%,var(--panel-2))}
.seg button:disabled{opacity:.3;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- stats & analysis ---------- */
.stat-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.stat-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.tile .lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tile .val{font-family:var(--f-mono);font-size:30px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.tile .sub{font-size:12.5px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:14px}
.barrow .track{height:10px;border-radius:999px;background:var(--fold);overflow:hidden;direction:ltr}
.barrow .track i{display:block;height:100%;border-radius:999px}
.barrow .num{font-family:var(--f-mono);font-size:13px;text-align:left;direction:ltr;color:var(--muted)}
.ticks{display:flex;gap:3px;flex-wrap:wrap;direction:ltr}
.ticks i{width:10px;height:22px;border-radius:2px}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.two-col{grid-template-columns:minmax(0,1fr)}}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.mlist li{border-bottom:1px solid var(--line);padding-bottom:8px}
.mlist li:last-child{border-bottom:0}
.empty{text-align:center;padding:36px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{font-family:var(--f-display);font-weight:400;margin:0;font-size:24px}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.linkbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px}
.linkbtn:hover{border-color:var(--brass)}
.linkbtn.danger{border-color:color-mix(in srgb,var(--bad) 50%,var(--line));color:var(--bad)}

/* =====================================================================
   4. Equity, outs, draws, board texture, hand descriptions

function equityVsRange(hole, board, range, iters){
  const dead = new Set([...hole, ...board]);
  const valid = range.filter(([a, b]) => !dead.has(a) && !dead.has(b));
  if (!valid.length) return 0.5;
  if (board.length === 5){
    const hs = evalHand([...hole, ...board]);
    let w = 0;
    for (const [a, b] of valid){ const vs = evalHand([a, b, ...board]); w += hs > vs ? 1 : hs === vs ? 0.5 : 0; }
    return w / valid.length;
  }
  const deck = FULL_DECK.filter(c => !dead.has(c));
  const bl = board.length, bd = new Array(5);
  let w = 0;
  for (let it = 0; it < iters; it++){
    const [a, b] = valid[Math.random() * valid.length | 0];
    for (let i = 0; i < bl; i++) bd[i] = board[i];
    let k = bl;
    while (k < 5){
      const c = deck[Math.random() * deck.length | 0];
      if (c === a || c === b) continue;
      let dup = false;
      for (let i = bl; i < k; i++) if (bd[i] === c){ dup = true; break; }
      if (!dup) bd[k++] = c;
    }
    const hs = evalHand([hole[0], hole[1], ...bd]), vs = evalHand([a, b, ...bd]);
    w += hs > vs ? 1 : hs === vs ? 0.5 : 0;
  }
  return w / iters;
}
// hero vs several opponents, each holding a hand from its own range
function equityMulti(hole, board, ranges, iters){
  if (ranges.length <= 1) return equityVsRange(hole, board, ranges[0] || ALL_COMBOS, iters);
  const dead = new Set([...hole, ...board]);
  const rs = ranges.map(r => { const v = r.filter(([a, b]) => !dead.has(a) && !dead.has(b)); return v.length ? v : ALL_COMBOS.filter(([a, b]) => !dead.has(a) && !dead.has(b)); });
  const deck = FULL_DECK.filter(c => !dead.has(c));
  const used = new Set();
  let w = 0, n = 0;
  for (let it = 0; it < iters; it++){
    used.clear();
    const hands = [];
    let ok = true;
    for (const r of rs){
      let cb, tries = 0;
      do { cb = r[Math.random() * r.length | 0]; tries++; } while ((used.has(cb[0]) || used.has(cb[1])) && tries < 15);
      if (used.has(cb[0]) || used.has(cb[1])){ ok = false; break; }
      used.add(cb[0]); used.add(cb[1]); hands.push(cb);
    }
    if (!ok) continue;
    const bd = board.slice();
    while (bd.length < 5){ const c = deck[Math.random() * deck.length | 0]; if (!used.has(c) && !bd.includes(c)) bd.push(c); }
    const hs = evalHand([...hole, ...bd]);
    let best = -1, cnt = 0;
    for (const h of hands){ const s = evalHand([...h, ...bd]); if (s > best){ best = s; cnt = 1; } else if (s === best) cnt++; }
    w += hs > best ? 1 : hs === best ? 1 / (cnt + 1) : 0;
    n++;
  }
  return n ? w / n : 1 / (rs.length + 1);
}

function drawInfo(hole, board){

function computeOuts(hole, board){
  if (board.length >= 5) return [];

  const cc = catOf(evalHand([...hole, ...board]));
  const topBoard = Math.max(...board.map(rankOf));
  const outs = [];
  for (let c = 0; c < 52; c++){
    if (dead.has(c)) continue;
    const nc = catOf(evalHand([...hole, ...board, c]));
    if (nc <= cc) continue;
    if (nc <= catOf(evalHand([...board, c]))) continue;          // improvement must use our hole cards
    const r = rankOf(c);
    if (nc === 1 && !(hole.some(h => rankOf(h) === r) && r > topBoard)) continue; // only "top pair" counts

/* =====================================================================
   5. Range narrowing — each action tells us something about a range
   ===================================================================== */
function narrow(range, board, action, dead){
  const ds = new Set([...board, ...dead]);
  const arr = range.filter(([a, b]) => !ds.has(a) && !ds.has(b)).map(cb => ({ cb, s: evalHand([...cb, ...board]) }));
  arr.sort((x, y) => x.s - y.s);
  const n = arr.length;
  arr.forEach((o, i) => {
    o.p = n > 1 ? i / (n - 1) : 0.5;
    if (board.length < 5){ const d = drawInfo(o.cb, board); if (d.fd || d.oesd) o.p = Math.max(o.p, 0.62); }
    o.h = (o.cb[0] * 31 + o.cb[1] * 17 + board.length * 7) % 20;
  });
  let keep;
  if (action === 'bet') keep = arr.filter(o => o.p >= 0.42 || o.h < 4);
  else if (action === 'raise') keep = arr.filter(o => o.p >= 0.65 || o.h < 2);
  else if (action === 'call') keep = arr.filter(o => (o.p >= 0.28 && o.p <= 0.93) || (o.p > 0.93 && o.h < 10));
  else if (action === 'check') keep = arr.filter(o => o.p <= 0.78 || o.h < 6);
  else keep = arr;
  if (keep.length < 6) keep = arr;
  return keep.map(o => o.cb);
}

function newPreScenario(){
  let heroPos, opener = null;
  if (Math.random() < 0.5) heroPos = rnd(['UTG','MP','CO','BTN','SB']);
  else { heroPos = rnd(['MP','CO','BTN','SB','BB','BB']); opener = rnd(ORDER_PRE.slice(0, ORDER_PRE.indexOf(heroPos))); }
  const act = c => preAction(heroPos, opener, c);
  const inR = ALL_CLASSES.filter(c => act(c) !== 'fold');
  const edge = ALL_CLASSES.filter(c => act(c) === 'fold' && neighbors(c).some(x => act(x) !== 'fold'));
  const u = Math.random();
  let cls;
  if (u < 0.4) cls = rnd(inR);
  else if (u < 0.75 && edge.length) cls = rnd(edge);
  else { const cb = rnd(ALL_COMBOS); cls = classOf(cb[0], cb[1]); }
  const cards = shuffle([...rnd(combosOf(cls))]);
  return { heroPos, opener, cls, cards, best: act(cls), id: Math.random() };
}
const blindOf = p => p === 'SB' ? 0.5 : p === 'BB' ? 1 : 0;
function preInfo(scn){
  const facing = !!scn.opener;
  const toCall = facing ? 2.5 - blindOf(scn.heroPos) : 1 - blindOf(scn.heroPos);
  const ip = !['SB','BB'].includes(scn.heroPos);
  const threeTo = ip ? 7.5 : 10;
  const seats = SEATS.map(pos => {
    const s = { pos, bet: blindOf(pos), state: 'waiting', stack: 100 - blindOf(pos) };
    if (pos === scn.heroPos) s.state = 'hero';
    else if (pos === scn.opener){ s.state = 'villain'; s.bet = 2.5; s.stack = 97.5; }
    else if (ORDER_PRE.indexOf(pos) < ORDER_PRE.indexOf(scn.heroPos)) s.state = 'folded';
    return s;
  });
  const pot = seats.reduce((t, s) => t + s.bet, 0);
  const req = facing ? toCall / (pot + toCall) : null;
  return { facing, toCall, threeTo, seats, pot, req, ip };
}
function preLabels(scn, info){
  return info.facing
    ? { fold: 'Fold', call: `Call ${fmt(info.toCall)}bb`, raise: `⁦3-Bet⁩ ל-${fmt(info.threeTo)}bb` }
    : { fold: 'Fold', call: scn.heroPos === 'SB' ? 'Limp (השלמה)' : 'Limp 1bb', raise: 'Raise ל-2.5bb' };
}
function preMistakeType(best, chosen, opener){
  if (chosen === 'call' && !opener) return 'limp';
  if (best === 'fold') return 'loose_pre';
  if (chosen === 'fold') return 'tight_pre';
  if (best === 'raise' && chosen === 'call') return 'passive_pre';
  return 'aggr_pre';
}

/* =====================================================================
   8. Post-flop trainer engine (hero vs one villain, three streets)
   ===================================================================== */
const MATCHUPS = [['UTG','BB'],['MP','BB'],['CO','BB'],['BTN','BB'],['SB','BB'],['CO','BTN'],['MP','BTN'],['UTG','CO'],['MP','CO'],['BTN','BB']];
const visBoard = h => h.board.slice(0, 3 + h.street);

function newPostHand(){
  const [op, ca] = rnd(MATCHUPS);
  const heroIsPFR = Math.random() < 0.55;
  const heroPos = heroIsPFR ? op : ca, vilPos = heroIsPFR ? ca : op;
  const opR = cachedCombos('rfi' + op, RFI[op]);
  const caR = cachedCombos('call' + ca + op, facingOf(ca, op).call);
  const heroStart = heroIsPFR ? opR : caR, vilStart = heroIsPFR ? caR : opR;
  const hero = shuffle([...rnd(heroStart)]);
  let vil;
  do { vil = rnd(vilStart); } while (vil.some(c => hero.includes(c)));
  const deck = shuffle(FULL_DECK.filter(c => !hero.includes(c) && !vil.includes(c)));
  const dead = 1.5 - blindOf(op) - blindOf(ca);
  const pot = 5 + dead;
  const h = {
    heroPos, vilPos, opener: op, caller: ca, heroIsPFR,
    heroIP: POST_ORDER.indexOf(heroPos) > POST_ORDER.indexOf(vilPos),
    hero, vil: [...vil], board: deck.slice(0, 5), street: 0, pot,
    heroStack: 97.5, vilStack: 97.5, heroTotal: 2.5, heroIn: 0, vilIn: 0,
    heroRange: heroStart.filter(cb => !cb.some(c => vil.includes(c))),
    vilRange: vilStart.filter(cb => !cb.some(c => hero.includes(c))),
    vilStartN: vilStart.length, log: [], node: null, done: false, how: null, id: Math.random(),
  };
  h.log.push({ k: 'pre', text: `${op} פותח ל-2.5bb, ${ca} קורא. בקופה ${fmt(pot)}bb.` });
  startStreet(h);
  return h;
}
function startStreet(h){
  h.heroIn = 0; h.vilIn = 0; h.heroChecked = false; h.raised = false;
  const b = visBoard(h);
  h.log.push({ k: 'street', text: STREET_EN[h.street], cards: h.street === 0 ? b : [b[b.length - 1]], pot: h.pot });
  if (h.heroIP) villainOpen(h); else heroNode(h);
}
function heroNode(h){
  const b = visBoard(h);
  h.node = {
    street: h.street, toCall: h.vilIn - h.heroIn, pot: h.pot,
    eq: equityVsRange(h.hero, b, h.vilRange, 2500),
    outs: outsInfo(h.hero, b), made: describeMade(h.hero, b), draws: drawInfo(h.hero, b), tex: boardTexture(b),
    vilN: h.vilRange.length,
  };
}
function putVil(h, to){ const add = Math.min(h.vilStack, to - h.vilIn); h.vilStack -= add; h.pot += add; h.vilIn += add; }
function putHero(h, to){ const add = Math.min(h.heroStack, to - h.heroIn); h.heroStack -= add; h.pot += add; h.heroIn += add; h.heroTotal += add; }
function villainOpen(h){
  const b = visBoard(h);
  const eq = equityVsRange(h.vil, b, h.heroRange, 600), d = drawInfo(h.vil, b);
  let p = eq > 0.7 ? 0.85 : eq > 0.5 ? 0.45 : ((d.fd || d.oesd) && h.street < 2) ? 0.5 : 0.18;
  if (!h.heroIsPFR && h.street === 0) p = Math.max(p, 0.6);   // villain is the pre-flop raiser → c-bets often
  if (Math.random() < p && h.vilStack > 0){
    const frac = eq > 0.75 ? rnd([0.66, 0.75, 1]) : rnd([0.33, 0.5, 0.66]);
    const amt = Math.min(h.vilStack, Math.max(1, roundHalf(frac * h.pot)));
    putVil(h, amt);
    h.log.push({ k: 'vil', text: `${h.vilPos} מהמר ${fmt(amt)}bb (${pct(amt / (h.pot - amt))}% מהקופה)` });
    h.vilRange = narrow(h.vilRange, b, 'bet', h.hero);
    heroNode(h);
  } else {
    h.log.push({ k: 'vil', text: `${h.vilPos} – צ׳ק` });
    h.vilRange = narrow(h.vilRange, b, 'check', h.hero);
    if (h.heroChecked) nextStreet(h); else heroNode(h);
  }
}
function villainRespond(h){
  const b = visBoard(h);
  const toCall = h.heroIn - h.vilIn;
  const eq = equityVsRange(h.vil, b, h.heroRange, 600), d = drawInfo(h.vil, b);
  const req = toCall / (h.pot + toCall);
  const drawy = (d.fd || d.oesd) && h.street < 2;
  if (!h.raised && eq > 0.78 && h.vilStack > toCall && Math.random() < 0.4){
    const to = Math.min(h.vilIn + h.vilStack, roundHalf(h.heroIn * 3));
    putVil(h, to); h.raised = true;
    h.log.push({ k: 'vil', text: `${h.vilPos} מעלה ל-${fmt(to)}bb` });
    h.vilRange = narrow(h.vilRange, b, 'raise', h.hero);
    heroNode(h);
    return;
  }
  if (eq >= req - (drawy ? 0.07 : 0.02) || (h.street < 2 && Math.random() < 0.08)){
    putVil(h, h.heroIn);
    h.log.push({ k: 'vil', text: `${h.vilPos} קורא ${fmt(toCall)}bb` });
    h.vilRange = narrow(h.vilRange, b, 'call', h.hero);
    nextStreet(h);
    return;
  }
  h.log.push({ k: 'vil', text: `${h.vilPos} מקפל` });
  endHand(h, 'vilFold');
}
function nextStreet(h){
  h.node = null;
  if (h.heroStack <= 0 || h.vilStack <= 0){ h.street = 2; return showdown(h); }
  if (h.street === 2) return showdown(h);
  h.street++;
  startStreet(h);
}
function showdown(h){
  const hs = evalHand([...h.hero, ...h.board]), vs = evalHand([...h.vil, ...h.board]);
  endHand(h, hs > vs ? 'win' : hs < vs ? 'lose' : 'split');
}
function endHand(h, how){
  h.node = null; h.done = true; h.how = how;
  h.net = how === 'win' || how === 'vilFold' ? h.pot - h.heroTotal : how === 'split' ? h.pot / 2 - h.heroTotal : -h.heroTotal;
}
function lineName(h, act){
  const st = h.street;
  if (act === 'raise' && h.heroChecked) return 'Check-Raise';
  if (act === 'call' && h.heroChecked) return 'Check-Call';
  if (act === 'fold' && h.heroChecked) return 'Check-Fold';
  if (act === 'bet'){
    if (h.heroIsPFR) return st === 0 ? 'C-Bet' : st === 1 ? 'Barrel (Turn)' : 'Barrel (River)';
    return h.heroIP ? 'Stab – הימור אחרי צ׳ק' : 'Lead / Donk Bet';
  }
  if (act === 'check') return h.heroIP ? 'Check Back' : 'Check';
  return ACT_EN[act];
}
function heroAct(h0, act, amt){
  const h = structuredClone(h0), node = h.node, b = visBoard(h);
  const fb = gradeDecision({ E: node.eq, street: node.street, toCall: node.toCall, pot: h.pot, outs: node.outs, made: node.made, tex: node.tex, draws: node.draws, isPFR: h.heroIsPFR, nOpp: 1, line: lineName(h, act) }, act, amt);
  if (act === 'fold'){ h.log.push({ k: 'hero', text: 'אתה מקפל' }); endHand(h, 'heroFold'); }
  else if (act === 'check'){
    h.log.push({ k: 'hero', text: 'אתה – צ׳ק' });
    h.heroChecked = true;
    h.heroRange = narrow(h.heroRange, b, 'check', h.vil);
    if (h.heroIP) nextStreet(h); else villainOpen(h);
  } else if (act === 'call'){
    h.log.push({ k: 'hero', text: `אתה קורא ${fmt(node.toCall)}bb` });
    putHero(h, h.vilIn);
    h.heroRange = narrow(h.heroRange, b, 'call', h.vil);
    nextStreet(h);
  } else {
    h.log.push({ k: 'hero', text: act === 'raise' ? `אתה מעלה ל-${fmt(amt)}bb` : `אתה מהמר ${fmt(amt)}bb (${pct(amt / h.pot)}% מהקופה)` });
    if (act === 'raise') h.raised = true;
    putHero(h, amt);
    h.heroRange = narrow(h.heroRange, b, act, h.vil);
    villainRespond(h);
  }
  return { h, fb };
}

const STYLES = {

  lag:    { en: 'LAG',    he: 'רחב-אגרסיבי – משחק הרבה ידיים ולוחץ', open: 1.35, call: 1.2, three: 1.8, bluff: 0.3, slack: 0.03, aggr: 1.3, limp: false },

  maniac: { en: 'Maniac', he: 'אגרסיבי מאוד – מהמר ומעלה בלי הפסקה', open: 2.0, call: 1.6, three: 3, bluff: 0.45, slack: 0.06, aggr: 1.7, limp: false },

const LEVELS = {
  easy:  { he: 'קל', d: 'הרבה שחקנים חלשים שקוראים יותר מדי.', styles: ['fish','fish','rock','fish','maniac'] },
  mixed: { he: 'מעורב', d: 'כמו שולחן אמיתי: קצת מכל סוג.', styles: ['tag','fish','lag','rock','fish'] },
  hard:  { he: 'קשה', d: 'שחקנים טובים ואגרסיביים.', styles: ['tag','lag','tag','lag','rock'] },

const BOT_NAMES = ['דני','מאיה','יוסי','רוני','נועה','אבי','שירה','גיל','טל','עומר'];
const POS_BY_OFFSET = ['BTN','SB','BB','UTG','MP','CO'];
const BASE_OPEN = { UTG: 0.18, MP: 0.23, CO: 0.33, BTN: 0.48, SB: 0.38, BB: 0.3 };
const potOf = g => g.players.reduce((t, p) => t + p.total, 0);
const canAct = p => !p.folded && !p.allIn;
const simBoard = g => g.board.slice(0, g.street === 0 ? 0 : g.street + 2);
function put(p, amt){ const add = Math.min(p.stack, amt); p.stack -= add; p.in += add; p.total += add; if (p.stack <= 0){ p.stack = 0; p.allIn = true; } return add; }

function newSession(cfg){
  const names = shuffle([...BOT_NAMES]);
  const styles = shuffle([...LEVELS[cfg.level].styles]);
  const players = [{ name: 'אתה', hero: true, style: 'tag' }, ...styles.map((s, i) => ({ name: names[i], style: s, hero: false }))];
  return { cfg, players, button: Math.random() * 6 | 0, hands: [] };
}
function newSimHand(sessPlayers, button, no){
  const deck = shuffle([...FULL_DECK]);
  const players = sessPlayers.map((pl, seat) => ({
    seat, name: pl.name, style: pl.style, hero: !!pl.hero, pos: POS_BY_OFFSET[(seat - button + 6) % 6],
    cards: [deck.pop(), deck.pop()], stack: 100, in: 0, total: 0, folded: false, allIn: false, acted: false,
    band: [0, 1], range: null, last: '', checked: false,
  }));
  const g = { no, button, players, board: deck.slice(0, 5), street: 0, bet: 1, minRaise: 1, raises: 0,
    limpers: 0, callers: 0, opener: null, pfr: null, toAct: null, log: [], done: false, decisions: [],
    hs: { vpip: false, pfr: false, threeBet: false, sawFlop: false, sd: false, wonSd: false, aggr: 0, calls: 0, cbetOpp: false, cbet: false } };
  const sb = players.find(p => p.pos === 'SB'), bb = players.find(p => p.pos === 'BB');
  put(sb, 0.5); put(bb, 1);
  sb.last = 'SB 0.5'; bb.last = 'BB 1';
  g.log.push({ k: 'street', text: `יד #${no} · Pre-Flop`, cards: [], pot: 1.5 });
  g.toAct = players.find(p => p.pos === 'UTG').seat;
  return g;
}
function simSpot(g, p){
  if (g.raises === 0) return p.pos === 'BB' ? 'bbOption' : 'unopened';
  return g.raises === 1 ? 'vsOpen' : g.raises === 2 ? 'vs3' : 'vs4';
}
function preThresh(spot, pos, st, g){
  const openerPos = g.opener != null ? g.players[g.opener].pos : null;
  if (spot === 'unopened'){ const o = Math.min(0.92, BASE_OPEN[pos] * st.open * (g.limpers ? 0.75 : 1)); return { raise: o, call: st.limp ? Math.min(0.85, o * 2.2) : o }; }
  if (spot === 'bbOption') return { raise: Math.min(0.4, 0.1 * st.three), call: 1 };
  if (spot === 'vsOpen'){
    const late = ['CO','BTN','SB'].includes(openerPos);
    const r = Math.min(0.5, (late ? 0.06 : 0.035) * st.three);
    let c = pos === 'BB' ? (late ? 0.4 : 0.26) : pos === 'SB' ? 0.03 : (late ? 0.15 : 0.10);
    c *= st.call * (g.callers ? 0.8 : 1);
    return { raise: r, call: Math.min(0.9, r + c) };
  }
  if (spot === 'vs3'){ const r = Math.min(0.1, 0.022 * st.three); return { raise: r, call: Math.min(0.3, r + 0.05 * st.call) }; }
  const r = Math.min(0.06, 0.016 * st.three);
  return { raise: r, call: Math.min(0.15, r + 0.012 * st.call) };
}
function preRaiseTo(g, p, spot){
  const ip = g.opener == null || POST_ORDER.indexOf(p.pos) > POST_ORDER.indexOf(g.players[g.opener].pos);
  let to;
  if (spot === 'unopened') to = (p.pos === 'SB' ? 3 : 2.5) + g.limpers;
  else if (spot === 'bbOption') to = 4 + g.limpers;
  else if (spot === 'vsOpen') to = g.bet * (ip ? 3 : 3.8) + g.callers * g.bet;
  else if (spot === 'vs3') to = g.bet * 2.3;
  else to = p.in + p.stack;
  to = roundHalf(to);
  if (to >= 0.4 * (p.in + p.stack)) to = p.in + p.stack;
  return to;
}
// what a player's pre-flop action says about his hand (a percentile band)
function bandFor(g, p, act){
  const spot = simSpot(g, p), t = preThresh(spot, p.pos, STYLES[p.hero ? 'tag' : p.style], g);
  let nb;
  if (act === 'raise') nb = [0, t.raise];
  else if (act === 'check') nb = [t.raise, 1];
  else if (act === 'call') nb = spot === 'unopened' && t.call <= t.raise ? [t.raise, Math.min(0.9, t.raise * 2.2)] : [t.raise, Math.max(t.raise + 0.03, t.call)];
  else return null;
  const lo = Math.max(p.band[0], nb[0]), hi = Math.min(p.band[1], nb[1]);
  return lo < hi ? [lo, hi] : nb;
}
function botPre(g, p){
  const spot = simSpot(g, p), st = STYLES[p.style], t = preThresh(spot, p.pos, st, g);
  const pc = PCT_RANK[classOf(p.cards[0], p.cards[1])], toCall = g.bet - p.in;
  if (pc <= t.raise && p.stack > toCall) return { act: 'raise', to: preRaiseTo(g, p, spot) };
  if (pc <= t.call) return toCall > 0 ? { act: 'call' } : { act: 'check' };
  return toCall > 0 ? { act: 'fold' } : { act: 'check' };
}
function botPost(g, p){
  const st = STYLES[p.style], b = simBoard(g);
  const opps = g.players.filter(q => !q.folded && q.seat !== p.seat);
  const eq = equityMulti(p.cards, b, opps.map(q => q.range || ALL_COMBOS), 300);
  const n = opps.length, fair = 1 / (n + 1), pot = potOf(g), toCall = g.bet - p.in;
  const d = drawInfo(p.cards, b), drawy = (d.fd || d.oesd) && g.street < 3;
  const R = Math.random();
  if (toCall === 0){
    const betT = fair + (1 - fair) * 0.32;
    let pb = eq >= betT ? 0.8 : drawy ? 0.45 : (g.pfr === p.seat && g.street === 1 && n === 1) ? 0.55 : eq >= fair ? 0.22 : st.bluff * (n === 1 ? 1 : 0.4);
    pb = Math.min(0.95, pb * st.aggr);
    if (R < pb){
      const frac = eq >= betT ? rnd([0.5, 0.66, 0.75, 1]) : rnd([0.33, 0.5, 0.66]);
      let to = Math.max(1, roundHalf(frac * pot));
      if (to >= 0.7 * p.stack) to = p.stack;
      return { act: 'bet', to };
    }
    return { act: 'check' };
  }
  const req = toCall / (pot + toCall), raiseT = fair + (1 - fair) * 0.48;
  if (eq >= raiseT && g.raises < 3 && p.stack > toCall && R < 0.45 * st.aggr){
    let to = roundHalf(g.bet * 2.8);
    if (to >= 0.6 * (p.stack + p.in)) to = p.stack + p.in;
    return { act: 'raise', to };
  }
  if (eq >= req - st.slack - (drawy ? 0.07 : 0.02)) return { act: 'call' };
  if (n === 1 && g.raises < 2 && p.stack > toCall && R < st.bluff * 0.25) return { act: 'raise', to: Math.min(p.stack + p.in, roundHalf(g.bet * 2.8)) };
  return { act: 'fold' };
}
function trackHero(g, p, act, toCall){
  const hs = g.hs;
  if (g.street === 0){
    if (act === 'call' && toCall > 0) hs.vpip = true;
    if (act === 'raise'){ hs.vpip = true; hs.pfr = true; if (g.raises >= 1) hs.threeBet = true; }
  } else {
    if (act === 'bet' || act === 'raise') hs.aggr++;
    if (act === 'call') hs.calls++;
    if (g.street === 1 && g.pfr === p.seat && g.bet === 0 && !hs.cbetOpp){ hs.cbetOpp = true; if (act === 'bet') hs.cbet = true; }
  }
}
function applyAction(g, seat, act, to){
  const p = g.players[seat], toCall = g.bet - p.in, b = simBoard(g);
  if (g.street === 0){ const nb = bandFor(g, p, act === 'bet' ? 'raise' : act); if (nb) p.band = nb; }
  if (p.hero) trackHero(g, p, act, toCall);
  let text;
  if (act === 'fold'){ p.folded = true; text = 'Fold'; }
  else if (act === 'check'){ text = 'Check'; p.checked = true; }
  else if (act === 'call'){
    const add = put(p, toCall);
    text = p.allIn ? `All-in ${fmt(p.in)}` : `Call ${fmt(add)}`;
    if (g.street === 0 && g.raises === 0) g.limpers++;
    else if (g.street === 0 && g.raises === 1) g.callers++;
  } else {
    const wasBet = g.bet === 0;
    to = Math.min(Math.max(roundHalf(to), g.bet + g.minRaise), p.in + p.stack);
    put(p, to - p.in);
    if (p.in > g.bet){
      const inc = p.in - g.bet;
      if (inc >= g.minRaise) g.minRaise = inc;
      g.bet = p.in; g.raises++; g.aggressor = seat;
      if (g.street === 0){ g.pfr = seat; if (g.opener == null) g.opener = seat; g.callers = 0; }
      g.players.forEach(q => { if (q.seat !== seat) q.acted = false; });
    }
    text = p.allIn ? `All-in ${fmt(p.in)}` : wasBet ? `Bet ${fmt(p.in)}` : `Raise ל-${fmt(p.in)}`;
  }
  p.acted = true; p.last = text;
  if (g.street > 0 && act !== 'fold' && p.range) p.range = narrow(p.range, b, act, []);
  g.log.push({ k: p.hero ? 'hero' : 'vil', text: `${p.hero ? 'אתה' : p.name} (${p.pos}): ${text}` });
  simAdvance(g);
}
function simAdvance(g){
  const alive = g.players.filter(p => !p.folded);
  if (alive.length === 1) return simFinish(g, alive, false);
  const pending = g.players.filter(p => canAct(p) && (!p.acted || p.in < g.bet));
  if (!pending.length) return simEndStreet(g);
  for (let k = 1; k <= 6; k++){

/* ---- the spot: whatever the form or the chat sends, made complete and checked ---- */
function normalizeSpot(raw, ev){
  const ctx = advCtx(ev), A = [];
  const hero = parseCards(raw.hero_cards);
  if (hero.length !== 2) return { error: 'צריך בדיוק שני קלפים שלך, למשל Ah Jd.' };
  const board = parseCards(raw.board);
  if (![0, 3, 4, 5].includes(board.length)) return { error: 'בלוח יכולים להיות 0, 3, 4 או 5 קלפים.' };
  const all = [...hero, ...board];
  if (new Set(all).size !== all.length) return { error: 'אותו קלף מופיע פעמיים.' };
  const post = board.length > 0;
  let pos = normPos(raw.position);
  if (!pos){ pos = 'MP'; A.push('לא צוין מיקום – הנחתי אמצע השולחן'); }
  const me = (ev.players || []).find(p => p.hero);
  let stack = numOrNull(raw.hero_stack);
  if (stack == null){ stack = me ? me.stack : ev.startChips; A.push(`הערימה שלך: ${stack} צ׳יפים (מההגדרות)`); }
  stack = Math.max(ctx.bb, stack);
  let pre = PRE_ACTIONS.includes(raw.preflop) ? raw.preflop : null;
  const raiseTo = numOrNull(raw.raise_to);
  if (!pre) pre = post ? 'raise' : raiseTo ? 'raise' : 'first_in';
  const facingPre = !post && ['raise', '3bet', '4bet'].includes(pre);
  const oppsRaw = Array.isArray(raw.opponents) ? raw.opponents.slice(0, 5) : [];
  const findP = name => (ev.players || []).find(p => !p.hero && name && p.name.trim() === String(name).trim());
  let opps = oppsRaw.map((o, i) => {
    o = o || {};
    const rp = findP(o.name);
    const key = ADV_STYLES[o.style] ? o.style : rp && ADV_STYLES[rp.style] ? rp.style : null;
    let stk = numOrNull(o.stack);
    if (stk == null) stk = rp ? rp.stack : stack;
    return {
      name: String(o.name || (rp && rp.name) || (oppsRaw.length > 1 ? `יריב ${i + 1}` : 'היריב')),
      styleKey: key || 'table', st: key ? ADV_STYLES[key] : ctx.table, stack: stk,
      role: ['raiser', 'caller', 'limper', 'blind', 'threebettor', 'fourbettor'].includes(o.role) ? o.role : null,
      lines: { flop: LINES.includes(o.flop) ? o.flop : null, turn: LINES.includes(o.turn) ? o.turn : null, river: LINES.includes(o.river) ? o.river : null },
      now: LINES.includes(o.now) ? o.now : null,
    };
  });
  if (opps.some(o => o.styleKey === 'table')) A.push(`יריבים בלי סגנון מוגדר: לפי פרופיל השולחן (${ctx.table.he})`);
  const generic = (role, i) => ({ name: i ? `יריב ${i + 1}` : 'היריב', styleKey: 'table', st: ctx.table, stack, role, lines: { flop: null, turn: null, river: null }, now: null });

  let pot = numOrNull(raw.pot);
  let heroIn = numOrNull(raw.hero_in);

    const aggRole = pre === 'raise' ? 'raiser' : pre === '3bet' ? 'threebettor' : pre === '4bet' ? 'fourbettor' : null;
    if (aggRole){

      if (!opps.some(o => o.role === aggRole)) (opps.find(o => !o.role) || opps[0]).role = aggRole;
      const nc = numOrNull(raw.callers);
      while (nc != null && opps.filter(o => o.role !== aggRole).length < Math.min(nc, 4)) opps.push(generic('caller', opps.length));
      opps.forEach(o => { if (!o.role) o.role = 'caller'; });
    } else {
      const nl = numOrNull(raw.limpers);
      while (nl != null && opps.length < Math.min(nl, 5)) opps.push(generic('limper', opps.length));

    }

}

/* ---- post-flop ---- */
function advisePost(sp, ctx){
  const { hero, board, opps } = sp;
  const street = board.length - 3, n = opps.length, multi = n > 1;

  const mi = opps.indexOf(main);
  const ranks = multi ? ranges.map(r => advRank(r, board, hero.cards)) : null;
  const prof = multi ? null : advProfile(hero.cards, board, ranges[0]);
  const E = multi ? equityMulti(hero.cards, board, ranges, 2500) : meanE(prof);
  const contEq = fr => multi ? equityMulti(hero.cards, board, ranks.map((rk, i) => topSlice(rk, fr[i]).map(o => o.cb)), 1400) : meanE(topSlice(prof, fr[0]));

    const implied = street < 2 && strongOuts >= 8 && rem > 0 ? strongOuts / (47 - street) * Math.min(rem, potCall * 1.5) * 0.4 / potCall : 0;
    opts.push({ k: 'fold', ev: 0 });
    opts.push({ k: 'call', amt: C, ev: (E * R + implied) * potCall - C, allin: C >= S, R, implied });
    const maxTo = Math.min(S, C + (main.stack != null ? main.stack : S));
    if (S > C && maxTo > C){
      let cands = [round5(C * 3), round5(P + 2 * C)].filter(a => a >= 2 * C && a < maxTo);
      if (!cands.length || maxTo <= (P + 2 * C) * 1.35) cands.push(maxTo);
      cands = [...new Set(cands)];

        const fs = opps.map((o, i) => foldShare(o.st, A - C, P + A, i === mi ? 1 : 1.15));
        const pAll = fs.reduce((t, f) => t * f, 1);
        const Ec = contEq(fs.map(f => 1 - f));

      const pAll = fs.reduce((t, f) => t * f, 1);
      const Ec = contEq(fs.map(f => 1 - f));

      const frac = pct(b.amt / P);
      steps.push(`להימור של ${b.amt} (${frac}% מהקופה): ${r.multi ? 'כל היריבים יקפלו' : `${name} יקפל`} בערך ${pct(b.fold)}% מהפעמים; כשממשיכים – יש לך ${pct(b.Ec)}% מול הידיים שממשיכות.`);
      if (E >= 0.6){
        X.bottom = `${out.title} – הימור ערך: ידיים חלשות ממך ישלמו.`;
        R.push(`אתה מוביל מול רוב הטווח (${pct(E)}%) – כל צ׳יפ שנכנס עכשיו הוא בדרך כלל שלך.`);
        R.push(sp.ip ? 'צ׳ק ייתן קלף חינם שעלול להפוך אותך למפסיד.' : `אם תעשה צ׳ק – ${r.multi ? 'הם לא תמיד יהמרו' : 'הוא לא תמיד יהמר'} בשבילך, וקלף חינם עלול לעזור ${r.multi ? 'להם' : 'לו'}.`);
        X.rule = 'הימור ערך = מהמרים כשידיים גרועות יותר יקראו. בשולחן ביתי קוראים הרבה – אז מהמרים גדול.';
      } else if (drawing){
        X.bottom = `${out.title} – Semi-Bluff עם ${strong} אאוטים.`;
        R.push(`ההימור מנצח בשתי דרכים: ${r.multi ? 'כולם מקפלים' : 'הוא מקפל'} מיד (${pct(b.fold)}%), או שאתה משלים בקלף הבא.`);
        X.rule = 'דרואו חזק (8+ אאוטים) משחקים באגרסיביות; דרואו חלש – בזהירות.';
      } else if (E >= 0.4){
        X.bottom = `${out.title} – הימור קטן לערך ולהגנה.`;
        R.push(`אתה מוביל מול חלק גדול מהטווח (${pct(E)}%), אבל יש הרבה קלפים שישפרו ${r.multi ? 'אותם' : 'אותו'} – עדיף לגבות מחיר עכשיו.`);
        X.rule = 'עם יד טובה-אבל-פגיעה: הימור קטן. מקבל ערך מידיים חלשות ולא בונה קופה ענקית.';
      } else {
        X.bottom = `${out.title} – בלוף: ${r.multi ? 'היריבים יקפלו' : `${name} יקפל`} בערך ${pct(b.fold)}% מהפעמים.`;
        R.push(`ליד שלך אין כמעט ערך בשואודאון (${pct(E)}%), אבל ${rock ? `${name} מקפל כל מה שלא חזק` : 'הלוח והקו שלך מספרים סיפור של יד חזקה'}.`);
        R.push(`ההימור צריך ש${r.multi ? 'יקפלו' : 'הוא יקפל'} ${pct(b.amt / (P + b.amt))}% מהפעמים כדי להרוויח – ו${r.multi ? 'הם מקפלים' : 'הוא מקפל'} יותר.`);
        X.rule = 'בלוף – רק מול מי שיודע לקפל, ובגודל הכי קטן שעדיין עובד.';
      }
      if (b.k === 'allin') R.push(`ה-SPR נמוך (${sprTxt}): הימור אחד מכניס הכל – אין טעם להשאיר מעט צ׳יפים מאחור.`);
      const smallest = !bets.some(o => o.amt < b.amt);
      X.size = E >= 0.6 ? `${frac}% מהקופה: גודל שעדיין מקבל קריאות מידיים חלשות${fish ? ' – ומול קורא-להכל אפשר אפילו יותר' : ''}.`
        : E < 0.4 && !drawing ? (smallest ? `${frac}% מהקופה: הגודל הקטן ביותר שעדיין מקפל מספיק.` : `${frac}% מהקופה: כאן הימור גדול מקפל הרבה יותר ידיים – וזה שווה את הסיכון.`)
        : drawing ? `${frac}% מהקופה: מספיק גדול כדי שיקפלו, ולא גדול מדי לפעמים שבהן ממשיכים.` : `${frac}% מהקופה: הימור קטן – מקבל ערך מידיים חלשות בלי לבנות קופה גדולה מול ידיים חזקות.`;
      if (chk) X.example = `דמיין 100 פעמים: בערך ${pct(b.fold)} פעמים ${r.multi ? 'כולם מקפלים' : 'הוא מקפל'} ואתה לוקח ${P} צ׳יפים מיד. ב-${100 - pct(b.fold)} האחרות ממשיכים, ואתה מנצח בערך ${pct(b.Ec)}% מהן. בממוצע תצא מהקופה עם ${approxEv(b.ev)} – לעומת ${approxEv(Math.max(0, chk.ev))} עם צ׳ק.`;
    }
  }

  // home-game adjustments that matter in this spot
  if (aggr && C > 0 && b.k !== 'fold' && r.made.cat >= 1 && r.made.cat <= 2) A.push(`מול ${name}: מי שמבלף הרבה – קוראים לו עם ידיים בינוניות יותר מהרגיל. לא מקפלים זוג טוב להימור אחד.`);
  if (aggr && C > 0 && b.k === 'fold' && r.made.cat >= 1) A.push('גם מול שחקן אגרסיבי לא קוראים עם הכל: היד שלך מנצחת כאן רק בלופים – ואין מספיק כאלה.');
  if (rock && C > 0) A.push(`${name} סלע: כשהוא מהמר – כמעט תמיד יש לו. ${b.k === 'fold' ? 'מקפלים בלב שלם.' : 'אם הוא מעלה – חשוב פעמיים.'}`);
  if (fish && C > 0) A.push(`${name} כמעט לא מהמר בלי יד – הימור שלו מראה יד אמיתית.`);
  if (fish && C === 0 && b.k !== 'check' && E >= 0.5) A.push(`מול ${name} (קורא להכל): מהמרים לערך, ואפשר גדול – הוא ישלם עם ידיים חלשות.`);
  if (fish && C === 0 && b.k === 'check' && E < 0.45) A.push('לא מבלפים שחקן שקורא להכל – הוא לא יקפל, גם כשאין לו כלום.');
  if (aggr && C === 0 && b.k === 'check' && !sp.ip && E >= 0.4) A.push('מול שחקן אגרסיבי: צ׳ק עם יד בינונית נותן לו לבלף לתוכך – ואז קוראים.');
  if (r.multi) A.push(`יש ${r.n} יריבים: צריך יד חזקה יותר, ובלופים עובדים פחות – כולם צריכים לקפל.`);
  if (r.spr <= 1.5 && b.k !== 'fold' && b.k !== 'check') A.push(`SPR נמוך (${sprTxt}): כמעט כל הערימה כבר בסכנה – עם יד טובה הולכים עד הסוף, בלי לשחק "קטן".`);

  // what comes next
  const allIn = b.k === 'allin' || (b.k === 'call' && b.allin);
  if (allIn) PL.push('הכל בפנים – אין עוד החלטות ביד הזו.');
  else if (b.k === 'call' && r.street < 2){
    PL.push(drawing ? 'אם השלמת בקלף הבא – הֵמר לערך. אם לא, ויש עוד הימור גדול – בדוק שוב את המחיר.' : 'אם ממשיכים להמר בקלף הבא – כל הימור נוסף מצמצם את הטווח לידיים חזקות יותר. הכנס את המצב החדש ליועץ.');
  } else if (!r.multi && (b.k === 'bet' || b.k === 'raise')){
    // if he comes back over the top
    const facing = b.k === 'raise';
    const Seff = Math.min(S, facing ? C + vStack : vStack);
    const J = facing ? Seff : Math.min(Seff, round5(b.amt * 3) >= Seff * 0.6 ? Seff : round5(b.amt * 3));
    if (J > b.amt){
      const Er = advEqVs(hole, board, advNarrow(range, board, 'raise', st, hole));
      const req = facing ? (J - b.amt) / (P + 2 * J - C) : (J - b.amt) / (P + 2 * J);
      PL.push(`אם הוא מעלה ל-${J}${J >= Seff ? ' (All-in)' : ''}: מול הידיים שהוא מעלה איתן יש לך כ-${pct(Er)}%, וצריך ${pct(req)}% ← ${verdict(Er, req)}.`);
    }
    if (b.k === 'bet' && r.street < 2) PL.push('אם הוא רק קורא – בקלף הבא שאל שוב: הקריאה שלו מראה יד בינונית או דרואו.');
  } else if (b.k === 'check' && !r.multi && !sp.ip){
    const B = round5(P * 0.66);
    const Eb = advEqVs(hole, board, advNarrow(range, board, 'bet', st, hole, sizeMul(0.66, st)));
    const req = B / (P + 2 * B);
    PL.push(`אם הוא מהמר אחרי הצ׳ק (נגיד ${B}): מול הידיים שהוא מהמר איתן יש לך כ-${pct(Eb)}%, צריך ${pct(req)}% ← ${verdict(Eb, req)}.`);
  } else if (b.k === 'check') PL.push(sp.ip ? (r.street < 2 ? 'הצ׳ק סוגר את הסיבוב – רואים את הקלף הבא בחינם.' : 'הצ׳ק מביא לשואודאון – רואים את הקלפים בלי לשלם עוד.') : 'אם מישהו מהמר אחרי הצ׳ק – הכנס את ההימור ליועץ ותקבל תשובה.');
}

function advExplainPre(out, r, ctx){
  const sp = r.sp, b = r.best, S = r.S, P = r.P, C = r.C, cls = r.cls;
  const pos = sp.hero.pos;
  const R = out.reasons, A = out.adjust, PL = out.plan, X = out.ex, steps = X.steps;
  const hp = handProfile(cls);
  const a = ri(cls[0]), bk = ri(cls[1]);
  const specul = (a === bk && a <= ri('8')) || (cls[2] === 's' && a - bk <= 2 && a <= ri('T'));
  out.nums.push({ k: 'היד', v: cls, d: r.pc <= 0.5 ? `בטופ ${Math.max(1, pct(r.pc))}% של הידיים` : 'בחצי החלש של הידיים' });
  steps.push(`היד שלך: ${cls} – ${handRank(r.pc)}. ${hp.note}`);
  if (!r.facing){
    const limpers = sp.opps.length;
    const tr = r.opts.filter(o => o.k === 'raise' || o.k === 'allin').sort((x, y) => y.ev - x.ev)[0];
    steps.push(`אתה ${POS_AT[pos]}, ${limpers ? `${nPlayers(limpers)} כבר ${limpers === 1 ? 'נכנס' : 'נכנסו'} בלימפ` : 'כולם קיפלו אליך'}, ${sp.behind ? `ואחריך עוד ${nPlayers(sp.behind)}` : 'ואתה אחרון לפעול'}.`);
    if (tr) steps.push(`${tr.k === 'allin' ? `All-in ${tr.amt}` : `העלאה ל-${tr.amt}`}: בערך ${pct(tr.fold)}% מהפעמים כולם מקפלים ואתה לוקח ${P}. כשקוראים לך (בממוצע ${fmt(tr.callers)} שחקנים) – יש לך ${pct(tr.Ec)}% מול הידיים שלהם${tr.p3 > 0.05 ? `, ובערך ${pct(tr.p3)}% מהפעמים מישהו יעלה מחדש` : ''}.`);
    if (b.k === 'raise' || b.k === 'allin') out.nums.push({ k: 'כולם מקפלים', v: pct(b.fold) + '%', d: `ותיקח ${P}` }, { k: 'כשקוראים', v: pct(b.Ec) + '%', d: 'Equity מול הקוראים' });
    if (b.k === 'raise'){
      X.bottom = limpers ? `${out.title} – ${cls} מספיק טובה כדי להעלות מעל הלימפרים.` : `${out.title} – ${cls} מספיק טובה לפתוח ${POS_FROM[pos]}.`;
      R.push(`${cls} חזקה מספיק כדי להיכנס לקופה – ועדיף בהעלאה, כדי שחלק מהפעמים כולם יקפלו.`);
      R.push(b.amt <= ctx.norm + limpers * 2 * ctx.bb ? `הגודל: הכניסה הרגילה בשולחן (${ctx.norm})${limpers ? ` ועוד ${2 * ctx.bb} לכל לימפר` : ''} – לא צריך יותר.` : `הגודל: יותר מהכניסה הרגילה (${ctx.norm}) – כדי לקפל ידיים חלשות ולקבל יותר כסף מהידיים שקוראות.`);
      X.rule = 'פותחים לגודל הרגיל של השולחן. גם עם יד חזקה – אותו גודל, כדי לא לחשוף אותה.';
    } else if (b.k === 'allin'){
      X.bottom = `${out.title} – עם ערימה קצרה, All-in עדיף על העלאה רגילה.`;
      R.push(`הערימה שלך (${S}) קטנה – העלאה רגילה תשאיר אותך עם מעט מדי צ׳יפים לפלופ.`);
      R.push(`All-in: בערך ${pct(b.fold)}% מהפעמים כולם מקפלים, וכשקוראים לך יש לך ${pct(b.Ec)}% – ותמיד תראה את כל חמשת הקלפים.`);
      X.rule = 'ערימה קצרה (פחות מ-3 כניסות רגילות): All-in או Fold.';
    } else if (b.k === 'check'){
      X.bottom = 'Check – רואים פלופ בחינם.';
      R.push('אתה בבליינד הגדול וכולם רק השוו – לא צריך לשלם כלום כדי לראות פלופ.');
      if (tr) R.push(`העלאה לא שווה כאן: ${cls} לא חזקה מספיק מול ${limpers + 1} הידיים שכבר בקופה.`);
      X.rule = 'עם יד בינונית בבליינד הגדול – לוקחים את הפלופ החינמי.';
    } else if (b.k === 'call'){
      X.bottom = `${out.title} – רואים פלופ בזול עם יד שמרוויחה כשהיא פוגעת.`;
      R.push(`כבר יש ${nPlayers(limpers)} בקופה: המחיר זול, ו-${cls} מרוויחה כשהיא פוגעת חזק.`);
      X.rule = 'לימפ מאחורי לימפרים – רק עם ידיים שפוגעות חזק (זוגות, מחוברים בצבע) ורק כשזה זול.';
    } else {
      X.bottom = `Fold – ${cls} חלשה מדי ${limpers ? 'כדי להיכנס לקופה הזו' : `לפתוח ${POS_FROM[pos]}`}.`;
      R.push(sp.behind ? `אחריך עוד ${nPlayers(sp.behind)}, ובשולחן הזה הרבה מהם קוראים – ${cls} לא מספיק חזקה מול הידיים שימשיכו.` : `${cls} לא מספיק חזקה מול הידיים שימשיכו.`);
      if (tr) R.push(`העלאה ל-${tr.amt} מקבלת קריאה מ-${fmt(tr.callers)} שחקנים בממוצע, ומולם יש לך רק ${pct(tr.Ec)}%.`);
      X.rule = 'כשנכנסים ב-100 ולא ב-25, כל יד עולה ביוקר – רוב הידיים מקפלים.';
    }
    if (tr) X.example = `דמיין 100 פעמים: ב-${pct(tr.fold)} מהן כולם מקפלים ואתה לוקח ${P}. בשאר הפעמים ממשיכים איתך – ושם ${cls} מנצחת בערך ${pct(tr.Ec)}%. בממוצע ${tr.k === 'allin' ? 'ה-All-in' : `ההעלאה ל-${tr.amt}`} שווה ${iso(signed(tr.ev))} צ׳יפים לפעם (קיפול = 0).`;
    const short = S <= ctx.norm * 3;
    if (short && b.k === 'fold') A.push(`ערימה קצרה (${S} – פחות מ-3 כניסות רגילות): משחקים All-in או Fold. העלאה רגילה תשאיר אותך עם מעט מדי צ׳יפים לפלופ.`);
    if (short && b.k === 'raise') A.push(`ערימה קצרה (${S}): העלאה ל-${b.amt} כבר מכניסה ${b.amt * 2 >= S ? 'חצי' : 'חלק גדול'} מהערימה – תחליט מראש מה תעשה מול All-in (למטה).`);
    if (specul && (b.k === 'fold' || b.k === 'call' || b.k === 'check')) A.push(`${cls} מרוויחה כשהיא פוגעת חזק – אבל כשנכנסים ב-${ctx.norm} והערימות קצרות, אין מספיק כסף מאחור כדי לקבל תשלום.`);
    if (b.k === 'raise' && r.pc <= 0.05) A.push('יד חזקה מאוד: פותחים לגודל הרגיל – יקראו לך גם ככה, וגודל חריג מסגיר את היד.');
    if (b.k === 'raise' && r.pc > 0.2 && isAggr(ctx.table)) A.push('השולחן אגרסיבי – יש סיכוי טוב שמישהו יעלה מחדש. פתח רק עם ידיים שתהיה מוכן להמשיך איתן.');
    if (limpers && b.k !== 'check') A.push(`${limpers === 1 ? 'לימפר אחד' : `${limpers} לימפרים`} לפניך: מעלים גדול יותר (${2 * ctx.bb} לכל אחד) או מקפלים – לימפ עם יד חלשה רק מזמין צרות.`);
    if (b.k === 'allin') PL.push('הכל בפנים – אין עוד החלטות ביד הזו.');
    else if (b.k === 'raise'){
      const req = (S - b.amt) / (P + 2 * S);
      PL.push(`אם מישהו הולך All-in (עד ${S}): מול הידיים שעושות את זה יש לך כ-${pct(r.E3)}%, צריך ${pct(req)}% ← ${verdict(r.E3, req)}.`);
      PL.push('אם רק קוראים לך: בפלופ – עם זוג עליון ומעלה או דרואו חזק ממשיכים. בלי כלום מול כמה יריבים – מוותרים.');
    } else if (b.k === 'check' || b.k === 'call') PL.push('בפלופ: עם זוג או דרואו – ממשיכים; בלי כלום – צ׳ק, וקיפול להימור.');
    return;
  }
  const agg = r.agg, callers = r.callers, req = C / (P + C), st = agg.st;
  const call = r.opts.find(o => o.k === 'call');
  out.nums.push({ k: 'Equity', v: pct(r.E) + '%', d: callers.length ? 'מול כל השחקנים בקופה' : 'מול הטווח שלו' }, { k: 'צריך', v: pct(req) + '%', d: 'Pot Odds' }, { k: 'הטווח שלו', v: pct(r.aggTop) + '%', d: 'מהידיים' });
  steps.push(`${agg.name} (${styleHe(agg, ctx)}) העלה ל-${sp.raiseTo}${callers.length ? (callers.length === 1 ? ', ושחקן אחד כבר קרא' : `, ו-${callers.length} שחקנים כבר קראו`) : ''}. בקופה ${P} צ׳יפים, ועליך לשלם ${C}.`);
  steps.push(`טווח ההעלאה שלו: בערך ${pct(r.aggTop)}% מהידיים – עד ידיים כמו ${edgeHands(r.aggTop).join(', ')}.`);
  steps.push(`מול ${callers.length ? 'כל הידיים בקופה' : 'הטווח הזה'} יש לך ${pct(r.E)}%. כדי לקרוא צריך ${iso(`${C} ÷ ${P + C} = ${pct(req)}%`)}${call && call.R < 1 ? ` – ובגלל שתשחק אחרי הפלופ${sp.ip ? '' : ' בלי פוזיציה'}, בפועל צריך קצת יותר` : ''}.`);
  const tr = r.opts.filter(o => o.k === 'raise' || o.k === 'allin').sort((x, y) => y.ev - x.ev)[0];
  if (tr) steps.push(`${tr.k === 'allin' ? `All-in ${tr.amt}` : `העלאה ל-${tr.amt}`}: ${callers.length ? 'כולם יקפלו' : `${agg.name} יקפל`} בערך ${pct(tr.fold)}% מהפעמים; כשממשיכים מולך – יש לך ${pct(tr.Ec)}%.`);
  if (b.k === 'fold'){
    X.bottom = `Fold – צריך ${pct(req)}% ויש לך ${pct(r.E)}% מול הטווח שלו.`;
    R.push(`מול הטווח של ${agg.name} יש לך ${pct(r.E)}% – פחות ממה שצריך.`);
    if (isRock(st)) R.push(`${agg.name} סלע – העלאה שלו היא כמעט תמיד יד חזקה.`);
    else if (tr && tr.ev < 0) R.push(`גם העלאה מחדש מפסידה: ${agg.name} לא יקפל מספיק, וכשהוא ממשיך – ${cls} בצרות.`);
    X.example = hundredChips(r.E, C, P + C);
    X.rule = 'לא כל יד "יפה" שווה מחיר גדול. כשההעלאה 100+ – A חלשה, K חלשה ומחוברים מתקפלים.';
  } else if (b.k === 'call'){
    X.bottom = `${out.title} – יש לך ${pct(r.E)}%, צריך ${pct(req)}%.`;
    R.push(`${pct(r.E)}% ${callers.length ? 'מול כל השחקנים בקופה' : 'מול הטווח שלו'} – מספיק כדי לשלם ${C}${call && call.imp > 0.01 ? ', ויש בונוס: כשתפגע חזק, ישלמו לך עוד (Implied Odds)' : ''}.`);
    if (isAggr(st) && tr) R.push('העלאה מחדש תקפל בעיקר את הידיים החלשות שלו – קריאה משאירה אותן בפנים.');
    X.example = hundredChips(r.E, C, P + C);
    X.rule = 'קריאה מול העלאה: צריך יד שמנצחת מספיק פעמים, ופוזיציה עוזרת לממש את זה.';
  } else {
    X.bottom = b.k === 'allin' ? `${out.title} – להכניס הכל עכשיו עדיף על קריאה.` : `${out.title} – העלאה מחדש (⁦3-Bet⁩) לערך.`;
    R.push(`${cls} חזקה מול הטווח של ${agg.name} (${pct(r.E)}%).`);
    R.push(b.k === 'allin' ? `All-in: ${callers.length ? 'כולם מקפלים' : 'הוא מקפל'} בערך ${pct(b.fold)}% מהפעמים, וכשממשיכים יש לך ${pct(b.Ec)}%. וגם – אין יותר החלטות קשות אחרי הפלופ.` : `העלאה ל-${b.amt}: בונה קופה כשאתה מוביל, ומקפלת ידיים שהיו מממשות נגדך Equity.`);
    const callEv = call ? call.ev : 0;
    X.example = `דמיין 100 פעמים: ב-${pct(b.fold)} מהן ${callers.length ? 'כולם מקפלים' : 'הוא מקפל'} ואתה לוקח ${P} צ׳יפים מיד. בשאר ממשיכים – ואתה מנצח בערך ${pct(b.Ec)}% מהן. בממוצע: ${iso(signed(b.ev))} צ׳יפים לפעם, לעומת ${iso(signed(callEv))} בקריאה.`;
    X.rule = 'מול שחקנים שמעלים רחב – מעלים מחדש עם ידיים חזקות (TT+, AQ+), ועם ערימה קצרה – All-in.';
  }
  if (isAggr(st) && b.k !== 'fold' && !callers.length) A.push(`${agg.name} מעלה רחב (${pct(r.aggTop)}% מהידיים) – ידיים כמו AJ, KQ ו-TT כבר חזקות מול הטווח שלו.`);
  if (isRock(st) && b.k === 'fold') A.push(`${agg.name} סלע – העלאה שלו = יד חזקה. מול שחקן אחר אותה יד הייתה אולי ממשיכה.`);
  if (sp.raiseTo >= 2 * ctx.norm) A.push(`העלאה גדולה מהרגיל (${sp.raiseTo} לעומת ${ctx.norm} בדרך כלל) – אצל רוב השחקנים זה מראה יד חזקה יותר.`);
  const short = S <= 3 * sp.raiseTo;
  if (short && b.k === 'allin') A.push(`הערימה שלך (${S}) קצרה ביחס להעלאה – כשממשיכים, All-in עדיף לרוב על קריאה: לא נשאר מספיק לשחק אחרי הפלופ.`);
  if (short && b.k === 'call' && call && !call.allin) A.push(`הערימה קצרה: אחרי הקריאה יישארו לך ${S - C}. בפלופ – עם זוג טוב או דרואו חזק הולכים All-in, בלי לשחק "קטן".`);
  if (callers.length) A.push(`כבר ${callers.length + 1} שחקנים בקופה – ידיים כמו AJ ו-KQ נחלשות (למישהו כבר יש A או K טובים יותר), וזוגות קטנים משתפרים.`);
  if (call && call.sq > 0.1 && b.k === 'call') A.push(`יש עוד ${nPlayers(sp.behind)} אחריך – קריאה עלולה לחטוף העלאה מחדש.`);
  if (b.k === 'allin' || (b.k === 'call' && call && call.allin)) PL.push('הכל בפנים – אין עוד החלטות ביד הזו.');
  else if (b.k === 'call'){
    PL.push('אחרי הפלופ: עם זוג עליון טוב ומעלה או דרואו חזק – ממשיכים. בלי כלום – מוותרים להימור.');
    if (call && call.sq > 0.1) PL.push('אם מישהו מאחוריך מעלה מחדש – לרוב קיפול.');
  } else if (b.k === 'raise'){
    const r4 = advBand(0, clip(r.aggTop * 0.3, 0.02, 0.1));
    const E4 = equityVsRange(sp.hero.cards, [], r4, 900);
    const aggIn = sp.raiseTo || C + sp.heroIn;
    const req4 = (S - b.amt) / (P + 2 * S - sp.heroIn - aggIn);
    PL.push(`אם הוא הולך All-in: מול הידיים שעושות את זה יש לך כ-${pct(E4)}%, צריך ${pct(req4)}% ← ${verdict(E4, req4)}.`);
    PL.push('אם הוא רק קורא: בפלופ – הימור המשך (C-Bet) ברוב הלוחות; הערימות כבר קטנות ביחס לקופה.');
  }
}

   10c. Home-game evening — buy-ins, re-buy rules, stop-loss
   ===================================================================== */
const EVE_KEY = 'felt-lab-evening-v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const nf = n => Math.round(n).toLocaleString('en-US');
function newEvening(prev){
  const base = { cps: 10, sb: 5, bb: 10, norm: 100, seats: 7, tableStyle: 'aggro', startChips: 200,
    rules: { cap: 60, bigCap: 100, bigAt: 1000, stopLoss: 1000, potManual: null } };
  const ev = prev ? { ...base, ...prev, rules: { ...base.rules, ...prev.rules } } : base;
  const first = ev.startChips / ev.cps;
  const keep = prev && prev.players ? prev.players : [{ id: 'me', hero: true, name: 'אני', style: 'unknown' }];
  return { ...ev, started: Date.now(), log: [], buys: [],
    players: keep.map(p => ({ id: p.id || uid(), hero: !!p.hero, name: p.name, style: p.style || 'unknown', stack: ev.startChips, buyIns: first, cashed: 0 })) };
}
function loadEvening(){
  const v = load(EVE_KEY, null);
  if (!v || !Array.isArray(v.players) || !v.players.some(p => p.hero)) return newEvening();
  return { ...newEvening(), ...v, rules: { ...newEvening().rules, ...v.rules }, log: v.log || [], buys: v.buys || [] };
}
const heroOf = ev => ev.players.find(p => p.hero) || ev.players[0];
// "the table's pot" = everything the players bought in tonight (₪), unless it was typed in by hand
const tableMoney = ev => ev.rules.potManual != null ? ev.rules.potManual : ev.players.reduce((t, p) => t + (p.buyIns || 0), 0);
function rebuyInfo(ev, p){
  const R = ev.rules, big = tableMoney(ev) >= R.bigAt, cap = big ? R.bigCap : R.cap;
  const stackNis = (p.stack || 0) / ev.cps;
  const lossRoom = R.stopLoss - ((p.buyIns || 0) - (p.cashed || 0));
  const max = Math.max(0, Math.min(cap, lossRoom));
  let why = null;
  if (stackNis >= cap) why = `יש ${fmt(stackNis)} ₪ בערימה – קונים רק מתחת ל-${cap} ₪`;
  else if (max <= 0) why = `הגיע לתקרת ההפסד (${nf(R.stopLoss)} ₪)`;
  return { big, cap, stackNis, lossRoom, max, ok: !why, why };
}

function useHotkeys(handler){
  const ref = useRef(handler); ref.current = handler;
  useEffect(() => {
    const f = e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const t = e.target, k = e.key.toLowerCase();
      if (t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && t.type !== 'range' && t.type !== 'checkbox'))) return;
      if (t && (t.tagName === 'BUTTON' || t.tagName === 'SUMMARY') && (k === 'enter' || k === ' ')) return;
      ref.current(k, e);
    };
    window.addEventListener('keydown', f);
    return () => window.removeEventListener('keydown', f);
  }, []);
}

      ${drawTags.length ? html`<dt>דרואו</dt><dd className="chips">${drawTags.map(t => html`<span key=${t} className="tag">${rich(t)}</span>`)}</dd>` : null}
      ${node.tex ? html`<dt>לוח</dt><dd>${rich(node.tex.label)} <span className="muted">· ${node.tex.tags.join(' · ')}</span></dd>` : null}
    </dl>` : null}

    <p className="plain">במילים פשוטות: מתוך 100 מצבים כאלה תנצח בערך ${pct(eq)}.</p>
    ${req != null ? html`<div style=${{ marginTop: '12px' }}>
      <dl className="kv">
        <dt>לקרוא</dt><dd className="mono">${fmt(toCall)}bb לקופה של ${fmt(pot)}bb</dd>
        <dt>Pot Odds</dt><dd className="mono"><bdi dir="ltr">${fmt(pot / toCall)}:1</bdi> · צריך ${pct(req)}%</dd>
      </dl>

    </div>` : null}
    ${outs && streetIdx < 2 ? html`<div style=${{ marginTop: '12px' }}>
      <dl className="kv">

        ${k ? html`<dt>הקלף הבא</dt><dd className="mono">${fmt(one * 100)}%${streetIdx === 0 ? html` <span className="muted">· עד הריבר ${fmt(two * 100)}%</span>` : null}</dd>` : null}
        ${k ? html`<dt>כלל 2/4</dt><dd className="mono"><bdi dir="ltr">${k}×2 ≈ ${k * 2}%${streetIdx === 0 ? ` · ${k}×4 ≈ ${Math.min(100, k * 4)}%` : ''}</bdi></dd>` : null}

        <span>${gr.cards.length} קלפים ← <b>${gr.label}</b>${gr.weak ? html` <span className="muted">(חלש יותר – לא תמיד מנצח)</span>` : null}</span>
        <${CardRow} cards=${gr.cards} />

      ${!outs.all.length ? html`<p className="plain">אין קלפים שמשפרים אותך ליד חזקה.</p>` : null}
    </div>` : null}
  </div>`;
}
function ActionBar({ toCall, callAmt, canRaise, minTo, maxTo, presets, def, pot, aggWord, onAct }){
  const facing = toCall > 0;
  const clamp = v => Math.max(minTo, Math.min(maxTo, roundHalf(v)));
  const [amt, setAmt] = useState(() => clamp(def));
  const allIn = amt >= maxTo;
  const doFold = () => facing && onAct('fold');
  const doCC = () => onAct(facing ? 'call' : 'check');
  const doBR = () => canRaise && onAct(aggWord, amt);
  useHotkeys(k => { if (k === 'f') doFold(); else if (k === 'c' || k === 'k') doCC(); else if (k === 'r' || k === 'b') doBR(); });
  const aggLabel = allIn ? `All-in ${fmt(amt)}` : aggWord === 'bet' ? `Bet ${fmt(amt)}` : `Raise ל-${fmt(amt)}`;
  return html`<div className="actions">
    ${canRaise ? html`<div className="sizer">
      <div className="sizer-top">
        <span className="amt">${aggWord === 'bet' ? 'הימור: ' : 'העלאה ל-'}<b>${fmt(amt)}bb</b>${aggWord === 'bet' ? html` <span className="muted">(${pct(amt / pot)}% מהקופה)</span>` : null}</span>
        <div className="presets">${presets.map(([l, v]) => html`<button key=${l} type="button" onClick=${() => setAmt(clamp(v))}>${l}</button>`)}</div>
      </div>
      <input id="bet-size" type="range" min=${minTo} max=${maxTo} step="0.5" value=${amt} onInput=${e => setAmt(+e.target.value)} onChange=${e => setAmt(+e.target.value)} aria-label="גודל הימור" />
    </div>` : null}
    <div className="btn-row">
      <button className="btn fold" disabled=${!facing} onClick=${doFold}>Fold<kbd>F</kbd></button>
      <button className="btn call" onClick=${doCC}>${facing ? (callAmt >= toCall ? `Call ${fmt(callAmt)}bb` : `All-in ${fmt(callAmt)}bb`) : 'Check'}<kbd>C</kbd></button>
      <button className="btn raise" disabled=${!canRaise} onClick=${doBR}>${aggLabel}<kbd>${aggWord === 'bet' ? 'B' : 'R'}</kbd></button>
    </div>
  </div>`;
}
function HandLog({ log }){
  const ref = useRef(null);
  useEffect(() => { if (ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [log.length]);
  return html`<ul className="log" ref=${ref}>${log.map((e, i) => html`<li key=${i}>

}

  const answer = a => {

/* ----------------------------- Post-flop trainer ----------------------------- */
function VillainHeat({ range }){
  const frac = useMemo(() => {
    const m = {};
    range.forEach(([a, b]) => { const c = classOf(a, b); m[c] = (m[c] || 0) + 1; });
    Object.keys(m).forEach(k => m[k] /= comboCount(k));
    return m;
  }, [range]);
  return html`<${RangeGrid} compact=${true} colorOf=${cls => ({ style: frac[cls] ? { background: `color-mix(in srgb, var(--raise) ${Math.round(25 + 75 * frac[cls])}%, var(--fold))` } : undefined })} />`;
}

        ${h.done ? html`<div className="result">

              minTo=${facing ? Math.min(maxTo, h.vilIn * 2) : Math.min(maxTo, 1)} maxTo=${maxTo} pot=${h.pot} aggWord=${facing ? 'raise' : 'bet'}
              presets=${facing ? [['x2.5', h.vilIn * 2.5], ['x3', h.vilIn * 3], ['x4', h.vilIn * 4], ['All-in', maxTo]] : [['33%', h.pot * 0.33], ['50%', h.pot * 0.5], ['75%', h.pot * 0.75], ['Pot', h.pot], ['All-in', maxTo]]}
              def=${facing ? h.vilIn * 3 : h.pot * 0.5} onAct=${act} />` : null}

          : html`<div className="hidden-note">${h.done ? 'היד הסתיימה. הקלפים של היריב חשופים על השולחן.' : ''}</div>`}

function SimGame({ sess, setSess, g, setG, onFinish, record }){
  const cfg = sess.cfg;
  const [lastFb, setLastFb] = useState(null);
  const gRef = useRef(g); gRef.current = g;
  const commit = n => {
    setG(n);
    if (n.done && !n.saved){ n.saved = true; setSess(s => ({ ...s, hands: [...s.hands, handRecord(n)] })); }
  };
  const hero = g.players.find(p => p.hero);
  const heroTurn = !g.done && g.players[g.toAct].hero;
  useEffect(() => {
    if (g.done || g.players[g.toAct].hero) return;
    const id = setTimeout(() => { const n = structuredClone(gRef.current); botAct(n); commit(n); }, SPEED[cfg.speed]);
    return () => clearTimeout(id);
  }, [g]);
  const node = useMemo(() => heroTurn ? simHeroNode(g) : null, [g]);
  const act = (a, to) => {
    if (!heroTurn) return;
    const p = g.players[g.toAct];
    const fb = g.street === 0 ? gradeSimPre(g, p, a)
      : gradeDecision({ E: node.eq, street: node.street, toCall: node.toCall, pot: node.pot, outs: node.outs, made: node.made, tex: node.tex, draws: node.draws, isPFR: g.pfr === p.seat, nOpp: node.nOpp, line: simLine(g, p, a) }, a, to);
    const dec = { grade: fb.grade, best: fb.best, act: fb.act, mtype: fb.mtype, ex: fb.ex, line: fb.line, labels: fb.labels || null, summary: fb.summary,
      street: g.street === 0 ? 'preflop' : STREET_KEY[g.street - 1], pot: potOf(g), board: simBoard(g), cards: p.cards, pos: p.pos, eq: node ? node.eq : null };
    const n = structuredClone(g);
    n.decisions.push(dec);
    applyAction(n, p.seat, a, to);
    commit(n);
    setLastFb(dec);
    record({ mode: 'sim', street: dec.street, grade: fb.grade, mtype: fb.mtype, text: `משחק · ${fb.summary}` });
  };
  const nextHand = () => {
    if (sess.hands.length >= cfg.hands) return onFinish();
    const nb = (sess.button + 1) % 6;
    setSess(s => ({ ...s, button: nb }));
    setG(newSimHand(sess.players, nb, sess.hands.length + 1));
    setLastFb(null);
  };
  useHotkeys(k => { if (g.done && (k === 'n' || k === 'enter' || k === ' ')) nextHand(); });
  const total = sess.hands.reduce((t, h) => t + h.net, 0);
  const seats = g.players.map(p => ({
    pos: p.pos, name: p.hero ? null : p.name, tag: p.hero ? null : STYLES[p.style].en,
    state: p.hero ? 'hero' : p.folded ? 'folded' : 'villain', cards: p.hero ? p.cards : null,
    reveal: !p.hero && g.done && g.sd && !p.folded ? p.cards : null,
    bet: p.in, stack: p.stack, acting: !g.done && g.toAct === p.seat, last: p.last,
  }));
  const board = simBoard(g);
  const inBets = g.players.reduce((t, p) => t + p.in, 0);
  const toCall = heroTurn ? g.bet - hero.in : 0;
  let bar = null;
  if (heroTurn){
    const pot = potOf(g), maxTo = hero.in + hero.stack, minTo = Math.min(maxTo, g.bet > 0 ? g.bet + g.minRaise : 1);
    let presets;
    if (g.street === 0){
      if (g.raises === 0){ const base = (hero.pos === 'BB' ? 3.5 : hero.pos === 'SB' ? 3 : 2.5) + g.limpers; presets = [[fmt(base) + 'bb', base], [fmt(base + 1) + 'bb', base + 1], [fmt(base + 2) + 'bb', base + 2], ['All-in', maxTo]]; }
      else if (g.raises === 1) presets = [['x3', g.bet * 3], ['x3.5', g.bet * 3.5], ['x4', g.bet * 4], ['All-in', maxTo]];
      else presets = [['x2.2', g.bet * 2.2], ['x2.5', g.bet * 2.5], ['All-in', maxTo]];
    } else if (g.bet === 0) presets = [['33%', pot * 0.33], ['50%', pot * 0.5], ['75%', pot * 0.75], ['Pot', pot], ['All-in', maxTo]];
    else presets = [['x2.5', g.bet * 2.5], ['x3', g.bet * 3], ['All-in', maxTo]];
    const def = g.street > 0 && g.bet === 0 ? presets[1][1] : presets[0][1];
    bar = html`<${ActionBar} key=${g.log.length} toCall=${toCall} callAmt=${Math.min(toCall, hero.stack)} canRaise=${hero.stack > toCall}
      minTo=${minTo} maxTo=${maxTo} presets=${presets} def=${def} pot=${pot} aggWord=${g.street > 0 && g.bet === 0 ? 'bet' : 'raise'} onAct=${act} />`;
  }
  const result = g.done ? g.log[g.log.length - 1].text : null;
  const isLast = sess.hands.length >= cfg.hands;
  const handDecisions = g.decisions;
  return html`<div className="trainer">
    <div className="col">
      <section className="panel">
        <div className="scn">
          <h2 className="scn-title">יד ${g.no} מתוך ${cfg.hands}</h2>
          <span className="tag">אתה <b>${hero.pos}</b></span>
          <span className="tag">${g.street === 0 ? 'Pre-Flop' : STREET_EN[g.street - 1]}</span>
          <span className="tag">תוצאה בסשן <b><bdi dir="ltr">${signed(total)}bb</bdi></b></span>
        </div>
        <${Table} heroPos=${hero.pos} seats=${seats} board=${board} pot=${potOf(g) - inBets} total=${potOf(g)} />
        ${g.done ? html`<div className="result">
            <div><div style=${{ fontWeight: 500 }}>${result}</div>
              <div className=${'net ' + (g.net >= 0 ? 'pos-net' : 'neg-net')}><bdi dir="ltr">${signed(g.net)}bb</bdi></div>
              ${handDecisions.length && !cfg.live ? html`<div className="muted small">ביד הזו: ${handDecisions.filter(d => d.grade !== 'mistake').length} מתוך ${handDecisions.length} החלטות נכונות. הניתוח המלא – בסוף הסשן.</div>` : null}</div>
            <button className="btn next" style=${{ flex: '0 0 auto' }} onClick=${nextHand}>${isLast ? 'לניתוח הסשן' : 'יד הבאה'}<kbd>N / Enter</kbd></button>
          </div>`
          : heroTurn ? bar
          : html`<div className="waiting"><span className="dots"><i></i><i></i><i></i></span>${g.players[g.toAct].name} חושב...</div>`}
      </section>
      <section className="panel"><h3>מהלך היד</h3><${HandLog} log=${g.log} /></section>
    </div>
    <aside className="col">
      ${cfg.live && lastFb ? html`<${FeedbackPanel} fb=${lastFb} labels=${lastFb.labels} streetName=${lastFb.street === 'preflop' ? 'Pre-Flop' : STREET_EN[STREET_KEY.indexOf(lastFb.street)]} />` : null}
      ${cfg.helpers ? html`<section className="panel">
        <h3>סיכויים</h3>
        ${node ? html`<${OddsCore} eq=${node.eq}
            eqLabel=${node.pre ? (node.vsN > 1 ? `Equity מול הטווחים של ${node.vsN} השחקנים שכבר נכנסו לקופה` : node.vsN ? 'Equity מול הטווח של השחקן שכבר נכנס לקופה' : 'Equity מול יד אקראית של שחקן אחד') : node.nOpp > 1 ? `Equity מול הטווחים המשוערים של ${node.nOpp} היריבים` : 'Equity מול הטווח המשוער של היריב'}
            toCall=${node.toCall} pot=${node.pot} node=${node.pre ? null : node} boardLen=${board.length} streetIdx=${node.pre ? 3 : node.street} />`
          : html`<div className="hidden-note">הסיכויים יופיעו כשתורך לפעול.</div>`}
        <${OddsExplainer} />
      </section>` : null}
      <section className="panel">
        <h3>היריבים בשולחן</h3>
        <ul className="mlist">${g.players.filter(p => !p.hero).map(p => html`<li key=${p.seat}><b>${p.name}</b> <span className="mono" style=${{ color: 'var(--brass)', fontSize: '12px' }}>${STYLES[p.style].en}</span><div className="muted">${STYLES[p.style].he}</div></li>`)}</ul>
      </section>
      <button className="linkbtn" onClick=${onFinish}>סיים את הסשן עכשיו וקבל ניתוח</button>
    </aside>
  </div>`;
}
function StatMeter({ def, v }){
  if (v == null) return html`<div className="statrow"><div className="statrow-top"><span><b>${def.n}</b> · ${def.he}</span><span className="muted small">אין מספיק נתונים</span></div></div>`;
  const pos = Math.min(1, v / def.max) * 100;
  const inRange = v >= def.lo && v <= def.hi;
  const val = def.num ? v.toFixed(1) : pct(v) + '%';
  const target = def.num ? `${def.lo}–${def.hi}` : `${pct(def.lo)}–${pct(def.hi)}%`;
  return html`<div className="statrow">
    <div className="statrow-top"><span>${rich(def.n)} · ${def.he}</span><span><b><bdi dir="ltr">${val}</bdi></b> <span className=${'pill ' + (inRange ? 'in' : 'out')}>${inRange ? 'בטווח המומלץ' : v < def.lo ? 'נמוך מהמומלץ' : 'גבוה מהמומלץ'}</span></span></div>
    <div className="meter"><div className="zone" style=${{ left: (def.lo / def.max * 100) + '%', width: ((def.hi - def.lo) / def.max * 100) + '%' }}></div><div className="mark" style=${{ left: pos + '%', background: inRange ? 'var(--good)' : 'var(--brass)' }}></div></div>
    <div className="muted small">${def.d} יעד: <bdi dir="ltr">${target}</bdi>.${!inRange ? ' ' + (v < def.lo ? def.low : def.high) : ''}</div>
  </div>`;
}
function DecisionCard({ d }){
  const L = d.labels || ACT_EN;
  return html`<div className="dec">
    <div className="dec-head">
      <span><b>יד #${d.no}</b> · ${d.pos} · ${d.street === 'preflop' ? 'Pre-Flop' : STREET_EN[STREET_KEY.indexOf(d.street)]} · קופה ${fmt(d.pot)}bb</span>
      <span style=${{ display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' }}><span className="muted small">יד:</span><${CardRow} cards=${d.cards} />${d.board.length ? html`<span className="muted small">לוח:</span><${CardRow} cards=${d.board} />` : null}</span>
