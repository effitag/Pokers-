    <div style=${{ marginTop: '8px' }}><${Verdict} grade=${d.grade} title=${VERDICT_TITLE[d.grade]} sub=${`בחרת ${L[d.act]}${d.grade !== 'best' ? `. מומלץ: ${L[d.best]}` : ''}.`} /></div>
    <${Explain} ex=${d.ex} />
  </div>`;
}
function SimSummary({ sess, onAgain, onSetup }){
  const a = useMemo(() => analyzeSession(sess.hands), [sess.hands]);
  if (!a.N) return html`<section className="panel"><div className="empty"><h2>לא שוחקו ידיים</h2><p>הסשן הסתיים לפני שיד אחת הושלמה.</p><button className="linkbtn" onClick=${onSetup}>חזרה להגדרות</button></div></section>`;
  const type = playerType(a);
  const byStreet = STREETS.map(([k, n]) => { const ds = a.decisions.filter(d => d.street === k); return { k, n, t: ds.length, a: ds.length ? ds.filter(d => d.grade !== 'mistake').length / ds.length : 0 }; });
  const mcount = {};
  a.decisions.forEach(d => { if (d.mtype) mcount[d.mtype] = (mcount[d.mtype] || 0) + 1; });
  const mlist = Object.entries(mcount).sort((x, y) => y[1] - x[1]);
  const tips = [];
  STAT_DEFS.forEach(d => { const v = a[d.k]; if (v == null) return; if (v < d.lo) tips.push({ w: (d.lo - v) / d.max, t: `${d.n}: ${d.low}` }); else if (v > d.hi) tips.push({ w: (v - d.hi) / d.max, t: `${d.n}: ${d.high}` }); });
  mlist.forEach(([k, c]) => tips.push({ w: c / Math.max(1, a.decisions.length) + (c >= 2 ? 0.2 : 0), t: `${MISTAKES[k].label}: ${MISTAKES[k].tip}` }));
  tips.sort((x, y) => y.w - x.w);
  const keyMistakes = a.decisions.filter(d => d.grade === 'mistake').sort((x, y) => y.pot - x.pot).slice(0, 5);
  const goodBig = a.decisions.filter(d => d.grade === 'best' && d.street !== 'preflop').sort((x, y) => y.pot - x.pot).slice(0, 2);
  let luck;
  if (a.acc == null) luck = 'לא התקבלו החלטות שאפשר לנתח בסשן הזה.';
  else if (a.net < 0 && a.acc >= 0.7) luck = 'הפסדת בסשן הזה, אבל רוב ההחלטות שלך היו נכונות. בטווח הקצר מזל משפיע מאוד – המשך לקבל החלטות כאלה, והתוצאות יגיעו.';
  else if (a.net > 0 && a.acc < 0.6) luck = 'הרווחת – אבל לא מעט החלטות לא היו מדויקות. אל תיתן לתוצאה לבלבל אותך: בטווח הארוך טעויות עולות כסף.';
  else if (a.net >= 0) luck = 'תוצאה טובה עם החלטות טובות – כך נראה משחק מנצח.';
  else luck = 'גם התוצאה וגם ההחלטות דורשות שיפור. התמקד בשלושת הטיפים – שם תרוויח הכי הרבה.';
  let run = 0;
  return html`<div className="col">
    <section className="panel">
      <div className="scn" style=${{ justifyContent: 'space-between' }}>
        <h2 className="scn-title" style=${{ fontSize: '26px' }}>ניתוח הסשן</h2>
        <div className="btn-row"><button className="linkbtn" onClick=${onAgain}>סשן חדש באותן הגדרות</button><button className="linkbtn" onClick=${onSetup}>שינוי הגדרות</button></div>
      </div>
      <p className="plain">${a.N} ידיים בשולחן ברמה ${LEVELS[sess.cfg.level].he}.${a.N < 20 ? ' מדגם קטן – המספרים יהיו מדויקים יותר אחרי 50 ידיים ומעלה.' : ''}</p>
    </section>
    <div className="stat-tiles">
      <div className="tile"><div className="lbl">תוצאה</div><div className=${'val ' + (a.net >= 0 ? 'pos-net' : 'neg-net')}><bdi dir="ltr">${signed(a.net)}</bdi></div><div className="sub">bb · ניצחת ב-${a.won} ידיים</div></div>
      <div className="tile"><div className="lbl">דיוק החלטות</div><div className="val">${a.acc == null ? '—' : pct(a.acc) + '%'}</div><div className="sub">${a.decisions.length} החלטות נבדקו</div></div>
      <div className="tile"><div className="lbl">bb/100</div><div className="val"><bdi dir="ltr">${signed(a.bb100)}</bdi></div><div className="sub">קצב רווח ל-100 ידיים</div></div>
      <div className="tile"><div className="lbl">הקופה הגדולה</div><div className="val pos-net"><bdi dir="ltr">${signed(a.biggestWin)}</bdi></div><div className="sub">ההפסד הגדול: <bdi dir="ltr">${signed(a.biggestLoss)}bb</bdi></div></div>
    </div>
    <section className="panel"><h3>מזל או החלטות?</h3><p style=${{ margin: 0 }}>${luck}</p></section>
    <div className="two-col">
      <section className="panel type-card">
        <h3>סגנון המשחק שלך</h3>
        <h2>${type.t}</h2>
        <p style=${{ margin: 0 }}>${type.d}</p>
        <div style=${{ marginTop: '8px' }}>${STAT_DEFS.map(d => html`<${StatMeter} key=${d.k} def=${d} v=${a[d.k]} />`)}</div>
      </section>
      <div className="col">
        <section className="panel">
          <h3>מה הכי כדאי לשפר</h3>
          ${tips.length ? html`<ol className="tips">${tips.slice(0, 3).map((t, i) => html`<li key=${i}>${rich(t.t)}</li>`)}</ol>` : html`<p className="muted" style=${{ margin: 0 }}>לא נמצאו חולשות בולטות בסשן הזה. כל הכבוד!</p>`}
        </section>
        <section className="panel">
          <h3>דיוק לפי שלב במשחק</h3>
          <div className="bars">${byStreet.map(s => html`<div key=${s.k} className="barrow">
            <span>${s.n}</span>
            <span className="track"><i style=${{ width: (s.t ? pct(s.a) : 0) + '%', background: s.a >= 0.8 ? 'var(--good)' : s.a >= 0.6 ? 'var(--brass)' : 'var(--bad)' }}></i></span>
            <span className="num">${s.t ? pct(s.a) + '%' : '—'} · ${s.t}</span>
          </div>`)}</div>
        </section>
        ${mlist.length ? html`<section className="panel">
          <h3>סוגי הטעויות</h3>
          <div className="bars">${mlist.map(([k, n]) => html`<div key=${k} className="barrow">
            <span>${MISTAKES[k].label}</span>
            <span className="track"><i style=${{ width: (n / mlist[0][1] * 100) + '%', background: 'var(--bad)' }}></i></span>
            <span className="num">${n}</span>
          </div>`)}</div>
        </section>` : null}
      </div>
    </div>
    <section className="panel">
      <h3>הידיים החשובות ללמוד מהן</h3>
      <p className="plain" style=${{ marginBottom: '12px' }}>הטעויות בקופות הגדולות ביותר – שם טעות עולה הכי הרבה.</p>
      ${keyMistakes.length ? html`<div className="col">${keyMistakes.map((d, i) => html`<${DecisionCard} key=${i} d=${d} />`)}</div>` : html`<p className="muted" style=${{ margin: 0 }}>לא היו טעויות בסשן הזה.</p>`}
      ${goodBig.length ? html`<div style=${{ marginTop: '16px' }}><h3>החלטות טובות בקופות גדולות</h3><div className="col">${goodBig.map((d, i) => html`<${DecisionCard} key=${i} d=${d} />`)}</div></div>` : null}
    </section>
    <section className="panel">
      <h3>כל הידיים</h3>
      <div className="hands">${sess.hands.map(h => { run += h.net; const r = run; return html`<details key=${h.no}>
        <summary><span className="mono muted">#${h.no}</span><span>${h.pos}</span><${CardRow} cards=${h.cards} /><span className="hboard">${h.board.length ? html`<${CardRow} cards=${h.board} />` : html`<span className="muted small">${h.folded ? 'קיפלת לפני הפלופ' : 'הסתיים לפני הפלופ'}</span>`}</span>
          <span className="mono" style=${{ textAlign: 'left' }}><bdi dir="ltr" className=${h.net > 0 ? 'pos-net' : h.net < 0 ? 'neg-net' : 'muted'}>${signed(h.net)}</bdi> <span className="muted small"><bdi dir="ltr">(${signed(r)})</bdi></span></span></summary>
        <div className="hbody">
          <${HandLog} log=${h.log} />
          ${h.shown.length ? html`<div className="small">${h.shown.map(s => html`<div key=${s.name} style=${{ display: 'flex', gap: '8px', alignItems: 'center', marginBottom: '4px' }}><b>${s.name}:</b><${CardRow} cards=${s.cards} /><span className="muted">${s.made}</span></div>`)}</div>` : null}
          ${h.decisions.map((d, i) => html`<${DecisionCard} key=${i} d=${{ ...d, no: h.no }} />`)}
        </div>
      </details>`; })}</div>
    </section>
  </div>`;

function SimView({ record }){
  const [cfg, setCfg] = useState(() => ({ hands: 25, level: 'mixed', helpers: false, live: false, speed: 'normal', ...load(SIM_KEY, {}) }));
  const [phase, setPhase] = useState('setup');
  const [sess, setSess] = useState(null);
  const [g, setG] = useState(null);
  const start = () => {
    save(SIM_KEY, cfg);
    const s = newSession(cfg);
    setSess(s); setG(newSimHand(s.players, s.button, 1)); setPhase('play');
  };
  if (phase === 'setup' || !sess) return html`<${SimSetup} cfg=${cfg} setCfg=${setCfg} onStart=${start} />`;
  if (phase === 'summary') return html`<${SimSummary} sess=${sess} onAgain=${start} onSetup=${() => setPhase('setup')} />`;
  return html`<${SimGame} sess=${sess} setSess=${setSess} g=${g} setG=${setG} onFinish=${() => setPhase('summary')} record=${record} />`;
}

function PotOddsCalc(){
  const [pot, setPot] = useState(10);
  const [bet, setBet] = useState(5);
  const [outs, setOuts] = useState(9);
  const after = pot + bet * 2, req = bet / after, one = outs / 46, two = 1 - ((47 - outs) / 47) * ((46 - outs) / 46);
  return html`<div className="calc">
    <label htmlFor="c-pot">בקופה לפני ההימור <b>${pot}bb</b></label>
    <input id="c-pot" type="range" min="2" max="100" step="1" value=${pot} onInput=${e => setPot(+e.target.value)} onChange=${e => setPot(+e.target.value)} />
    <label htmlFor="c-bet">היריב מהמר <b>${bet}bb</b> <span className="muted">(${pct(bet / pot)}% מהקופה)</span></label>
    <input id="c-bet" type="range" min="1" max="100" step="1" value=${bet} onInput=${e => setBet(+e.target.value)} onChange=${e => setBet(+e.target.value)} />
    <label htmlFor="c-outs">האאוטים שלך <b>${outs}</b></label>
    <input id="c-outs" type="range" min="0" max="20" step="1" value=${outs} onInput=${e => setOuts(+e.target.value)} onChange=${e => setOuts(+e.target.value)} />
    <${EquityBar} eq=${one} req=${req} />
    <p style=${{ margin: 0 }}>אתה צריך לשלם <b>${bet}bb</b> כדי לזכות בקופה של <b>${after}bb</b> ← <b><bdi dir="ltr">${bet} ÷ ${after} = ${pct(req)}%</bdi></b>. עם ${outs} אאוטים יש לך כ-<b>${fmt(one * 100)}%</b> להשלים בקלף הבא (ועד הריבר: ${fmt(two * 100)}%, אם תראה את שני הקלפים).</p>
    <p style=${{ margin: 0, color: one >= req ? 'var(--good)' : 'var(--bad)' }}>${one >= req ? 'מספיק – קריאה רווחית.' : 'לא מספיק לקלף אחד – קריאה רק אם יש Implied Odds (כסף נוסף שתרוויח כשתשלים).'}</p>
  </div>`;
}

function formToRaw(f, ev){
  const board = f.board.filter(c => c != null);
  const opp = (o, extra) => {
    const p = ev.players.find(x => !x.hero && x.id === o.pid);
    const st = numOrNull(o.stack);
    return { name: p ? p.name : (o.name || undefined), style: o.style || (p && ADV_STYLES[p.style] ? p.style : undefined), stack: st != null ? st : p ? p.stack : undefined, ...extra };
  };
  const raw = { hero_cards: f.hero.filter(c => c != null), board, position: f.pos, hero_stack: numOrNull(f.stack) };
  if (!board.length){
    raw.preflop = f.pre;
    if (f.pre === 'limped') raw.limpers = f.limpers;
    if (f.pre === 'raise' || f.pre === '3bet'){
      raw.raise_to = numOrNull(f.raiseTo);
      raw.opponents = [opp(f.opps[0], { role: f.pre === 'raise' ? 'raiser' : 'threebettor' })];
      if (f.pre === 'raise') raw.callers = f.callers;
      else raw.hero_in = numOrNull(f.heroIn);
    }
  } else {
    const toCall = numOrNull(f.toCall) || 0;
    Object.assign(raw, { pot: numOrNull(f.pot), to_call: toCall, in_position: f.ip, preflop_aggressor: f.agg });
    raw.opponents = f.opps.map((o, i) => opp(o, { flop: o.flop || undefined, turn: o.turn || undefined, now: o.now || (i === 0 && toCall > 0 ? 'bet' : undefined) }));
  }
  return raw;
}
// a spot from the chat → the form, so it can be checked and changed by hand
function rawToForm(raw, ev){
  const f = newForm(ev), hc = parseCards(raw.hero_cards), bc = parseCards(raw.board);
  const s = v => v != null && isFinite(+v) ? String(+v) : '';
  f.hero = [hc[0] ?? null, hc[1] ?? null];
  f.board = [0, 1, 2, 3, 4].map(i => bc[i] ?? null);
  f.pos = normPos(raw.position) || f.pos;
  f.ip = typeof raw.in_position === 'boolean' ? raw.in_position : f.pos === 'BTN' || f.pos === 'CO';
  if (raw.hero_stack != null) f.stack = s(raw.hero_stack);
  if (PRE_ACTIONS.includes(raw.preflop) && raw.preflop !== '4bet') f.pre = raw.preflop;
  if (raw.limpers != null) f.limpers = clip(+raw.limpers || 1, 1, 5);
  if (raw.raise_to != null) f.raiseTo = s(raw.raise_to);
  if (raw.callers != null) f.callers = clip(+raw.callers || 0, 0, 4);
  if (raw.hero_in != null) f.heroIn = s(raw.hero_in);
  f.pot = s(raw.pot); f.toCall = s(raw.to_call);
  if (['hero', 'opponent', 'none'].includes(raw.preflop_aggressor)) f.agg = raw.preflop_aggressor;
  if (Array.isArray(raw.opponents) && raw.opponents.length) f.opps = raw.opponents.slice(0, 3).map(o => {
    o = o || {};
    const p = ev.players.find(x => !x.hero && o.name && x.name.trim() === String(o.name).trim());
    const ln = v => LINES.includes(v) ? v : '';
    return { pid: p ? p.id : '', name: p ? '' : String(o.name || ''), style: ADV_STYLES[o.style] ? o.style : '', stack: s(o.stack), flop: ln(o.flop), turn: ln(o.turn), now: ln(o.now) };
  });
  return f;
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch (e){}
  try {
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e){ return false; }
}

  const slots = [...hero, ...board];

  const used = new Set(slots.filter(c => c != null));

  const pick = c => {
    const i = act != null ? act : slots.findIndex(x => x == null);

    const s = slots.slice(); s[i] = c; apply(s);
    const nx = s.findIndex((x, k) => x == null && k > i);
    setAct(nx >= 0 ? nx : null);

      ${x.assumptions.length ? html`<div style=${{ marginTop: '10px' }}><span className="ex-lbl">הנחות שהמנוע עשה</span><ul className="bul muted">${x.assumptions.map((t, i) => html`<li key=${i}>${t}</li>`)}</ul></div>` : null}

}

/* --- the chat: Claude only turns your words into a spot; the advice itself comes from the engine above --- */
function useSampleFn(){
  const [s, setS] = useState(() => LIVE_MEM.sample || { fn: null, st: 'loading' });
  useEffect(() => {
    if (s.st !== 'loading') return;
    let alive = true;
    const done = v => { LIVE_MEM.sample = v; if (alive) setS(v); };
    const c = window.claude;
    if (!c || typeof c.use !== 'function'){ done({ fn: null, st: 'none' }); return; }
    (async () => {
      try { const fn = await c.use('sample'); done(fn ? { fn, st: 'ready' } : { fn: null, st: 'none' }); }
      catch (e){ done({ fn: null, st: 'none' }); }
    })();
    return () => { alive = false; };
  }, []);
  const hide = why => { const v = { fn: null, st: 'none', why }; LIVE_MEM.sample = v; setS(v); };
  return [s, hide];
}
function chatInstructions(ev){
  const hero = heroOf(ev), others = ev.players.filter(p => !p.hero);
  return [
    'You turn a poker player\'s message into data for a live advisor. He plays a home cash game (No-Limit Texas Hold\'em) and writes in Hebrew. A local engine computes the actual advice from your data, so your job is parsing, not deciding.',
    '',
    'Tonight\'s game:',
    `- ${ev.cps} chips = 1 ₪. Blinds ${ev.sb}/${ev.bb} chips. A normal pre-flop raise here is about ${ev.norm} chips.`,
    `- Hero's stack right now: ${hero.stack} chips.`,
    others.length ? `- Players (name → style): ${others.map(p => `${p.name} → ${ADV_STYLES[p.style] ? p.style : 'unknown'}`).join(', ')}.` : '- No player list.',
    `- Table style when unknown: ${ev.tableStyle}.`,
    LIVE_MEM.spot ? `- The previous spot, for follow-up messages: ${JSON.stringify(LIVE_MEM.spot)}` : '',
    LIVE_MEM.lastTitle ? `- The engine's last recommendation: ${LIVE_MEM.lastTitle}` : '',
    '',
    'Reply with ONLY one JSON object, in one of these shapes:',
    '1. {"type":"spot","spot":{...}} when the message describes a hand. Fill every field you can infer.',
    '2. {"type":"question","answer":"..."} for a general question (rules, terms, strategy) that is not about one specific hand. Answer in Hebrew, at most 4 short sentences, practical, for a beginner at an aggressive home game with short stacks.',
    '3. {"type":"need_info","ask":"..."} ONLY when hero\'s two cards are missing, or after the flop the pot size is missing. Ask one short question in Hebrew.',
    '',
    'Spot fields (leave out what you do not know; never invent cards):',
    '- hero_cards: like "Ah Kd". Ranks 2-9 T J Q K A, suits s h d c. Hebrew suits: ספייד/עלה=s, לב/הארט=h, יהלום/דיאמונד=d, תלתן/קלאב=c. אס=A, מלך/קינג=K, מלכה/קווין=Q, נסיך/ג׳ק=J, 10=T. Suits not given: same suit if he says "בצבע"/"סוטד", otherwise two different suits.',
    '- board: "" before the flop, else 3, 4 or 5 cards like "Kc 7s 2d". Suits not given: no flush possible unless he mentions one. Never repeat a card.',
    '- position: EP|MP|CO|BTN|SB|BB (כפתור/דילר=BTN, בליינד קטן=SB, בליינד גדול=BB, ראשון/מוקדם=EP, אמצע=MP, אחד לפני הכפתור=CO).',
    '- hero_stack: chips hero has behind now. pot: chips in the middle now, INCLUDING the bet hero faces. to_call: chips hero must add to call (0 if nobody bet).',
    '- in_position: true if hero acts last after the flop.',
    '- preflop (before the flop only): first_in (all folded to hero) | limped | raise | 3bet (hero raised and was re-raised) | 4bet. raise_to: total size of the last raise. hero_in: chips hero already put in this round. limpers, callers: counts.',
    '- preflop_aggressor (after the flop): hero | opponent | none.',
    '- opponents: [{"name","style","stack","role","flop","turn","river","now"}]. style: aggro|maniac|lag|tag|rock|fish — take it from the player list when the name matches. role: raiser|caller|limper|threebettor. flop/turn/river: what he did on that earlier street (check|bet|call|raise). now: what he did on the current street (bet|raise|check|call). Put the player who bet into hero first.',
    '- Amounts in ₪/שקל/שקלים: multiply by 10 to get chips. "חצי קופה" or "קופה": work it out from the pot.',
    '- A follow-up ("ואם הוא מעלה ל-400?", "בטרן יצא 9") starts from the previous spot and changes only what changed.',
    '',
    'Example reply: {"type":"spot","spot":{"hero_cards":"Ah Jc","board":"Jh 7c 2d","position":"BTN","hero_stack":300,"pot":350,"to_call":100,"preflop_aggressor":"opponent","opponents":[{"name":"דני","style":"aggro","stack":300,"now":"bet"}]}}',
  ].filter(Boolean).join('\n');
}
const SAMPLE_HIDE = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];
const SAMPLE_MSG = {
  rate_limited: 'יותר מדי שאלות ברצף, או שנגמרה מכסת השימוש שלך ב-Claude. נסה שוב בעוד כמה דקות – או השתמש בטופס.',
  session_expired: 'צריך להתחבר מחדש ל-Claude, ואז לנסות שוב.',
  refused: 'Claude לא ענה על ההודעה הזו. נסח אותה אחרת.',
  empty_completion: 'לא התקבלה תשובה. נסה לנסח שוב.',
  invalid_json: 'לא הצלחתי להבין את ההודעה. נסה לנסח אחרת – או השתמש בטופס.',
  prompt_too_large: 'השיחה ארוכה מדי. נקה את הצ׳אט ונסה שוב.',
};
// a left-to-right mark after each typed card keeps its suit symbol next to it inside Hebrew text
const keepSuits = t => String(t).replace(/((?:10|[2-9TJQKA])[♠♥♦♣])/gi, '$1\u200E');
const CHAT_EXAMPLES = ['יש לי A♠K♦\u200E בכפתור, דני העלה ל-150, נשארו לי 400', 'פלופ K-7-2, יש לי 77, בקופה 300, הוא הימר 100, יש לי 500', 'מה זה SPR ולמה זה חשוב אצלנו?'];
function LiveChat({ ev, onResult, onOpenSpot, goForm }){
  const [smp, hideSample] = useSampleFn();
  const [msgs, setMsgs] = useState(() => LIVE_MEM.chat);
  const [text, setText] = useState('');
  const [busy, setBusy] = useState(false);
  const ctl = useRef(null), box = useRef(null);
  useEffect(() => { LIVE_MEM.chat = msgs; if (box.current) box.current.scrollTop = box.current.scrollHeight; }, [msgs]);
  useEffect(() => () => { if (ctl.current) ctl.current.abort(); }, []);
  const push = m => setMsgs(ms => [...ms, m].slice(-40));
  const handle = reply => {
    const raw = JSON.stringify(reply);
    if (!reply || typeof reply !== 'object') return push({ role: 'assistant', kind: 'note', text: SAMPLE_MSG.invalid_json, raw: '{}' });
    if (reply.type === 'question' && reply.answer) return push({ role: 'assistant', kind: 'text', text: String(reply.answer), raw });
    if (reply.type === 'need_info') return push({ role: 'assistant', kind: 'text', text: String(reply.ask || 'חסר לי מידע – מה הקלפים שלך?'), raw });
    if (reply.type === 'spot' && reply.spot && typeof reply.spot === 'object'){
      const sp = normalizeSpot(reply.spot, ev);
      if (sp.error) return push({ role: 'assistant', kind: 'text', text: sp.error, raw });
      let x;
      try { const ctx = advCtx(ev); x = explainAdvice(advise(sp, ctx), ctx); }
      catch (e){ console.error(e); return push({ role: 'assistant', kind: 'note', text: 'משהו השתבש בחישוב. נסה לפתוח את המצב בטופס.', raw }); }
      LIVE_MEM.spot = reply.spot; LIVE_MEM.lastTitle = `${x.title} (${x.confText})`;
      onResult(x, 'chat');
      return push({ role: 'assistant', kind: 'advice', x, spot: reply.spot, raw });
    }
    push({ role: 'assistant', kind: 'note', text: SAMPLE_MSG.invalid_json, raw });
  };
  const send = async (q0) => {
    const q = (q0 != null ? q0 : text).trim();
    if (!q || busy || !smp.fn) return;
    const hist = [...msgs, { role: 'user', text: q }];
    setMsgs(hist); setText(''); setBusy(true);
    const c = new AbortController(); ctl.current = c;
    const turns = [{ role: 'user', content: chatInstructions(ev) },
      ...hist.slice(-7).filter(m => m.role === 'user' || m.raw).map(m => ({ role: m.role, content: m.role === 'user' ? m.text : m.raw }))];
    try {
      const reply = await smp.fn.json(turns, { modelTier: 'quick', cache: false, signal: c.signal });
      handle(reply);
    } catch (e){
      const code = e && e.code;
      if (code === 'cancelled') push({ role: 'assistant', kind: 'note', text: 'נעצר.' });
      else if (SAMPLE_HIDE.includes(code)) hideSample(code);
      else push({ role: 'assistant', kind: 'note', text: SAMPLE_MSG[code] || 'תקלה זמנית בחיבור ל-Claude. נסה שוב.' });
    } finally { setBusy(false); ctl.current = null; }
  };
  if (smp.st === 'loading') return html`<section className="panel"><div className="waiting"><span className="dots"><i></i><i></i><i></i></span>בודק אם הצ׳אט זמין כאן...</div></section>`;
  if (smp.st !== 'ready') return html`<section className="panel"><div className="empty">
    <h2>הצ׳אט לא זמין כאן</h2>
    <p>${smp.why === 'not_granted' ? 'לא אישרת לאפליקציה לשאול את Claude, אז הצ׳אט כבוי בצפייה הזו.' : 'הצ׳אט עובד רק כשהאפליקציה פתוחה בתוך claude.ai – שם הוא שולח את ההודעה שלך ל-Claude, שמתרגם אותה לנתונים.'} הטופס נותן בדיוק את אותן תשובות – פשוט בלחיצות במקום במילים.</p>
    <button className="linkbtn" onClick=${goForm}>לטופס השאלה</button>
  </div></section>`;
  return html`<section className="panel col" style=${{ gap: '12px' }}>
    <p className="plain" style=${{ margin: 0 }}>כתוב את המצב במילים שלך. Claude רק מתרגם את ההודעה לנתונים – את ההמלצה מחשב המנוע של האפליקציה. כל הודעה נשלחת מחשבון ה-Claude שלך וצורכת ממכסת השימוש שלך.</p>
    <div className="chat" ref=${box}>
      ${!msgs.length ? html`<div className="col" style=${{ gap: '8px' }}><span className="ex-lbl">אפשר להתחיל ככה</span><div className="chips-row">${CHAT_EXAMPLES.map(t => html`<button key=${t} type="button" className="chip-btn" onClick=${() => send(t)}>${t}</button>`)}</div></div>` : null}
      ${msgs.map((m, i) => m.role === 'user' ? html`<div key=${i} className="bubble-u">${keepSuits(m.text)}</div>`
        : m.kind === 'advice' ? html`<div key=${i} className="bubble-a"><${AdviceCard} x=${m.x} compact=${true} onOpen=${() => onOpenSpot(m.spot)} /></div>`
        : html`<div key=${i} className=${'bubble-a txt' + (m.kind === 'note' ? ' note' : '')}>${rich(keepSuits(m.text))}</div>`)}
      ${busy ? html`<div className="bubble-a txt"><span className="dots"><i></i><i></i><i></i></span> חושב...</div>` : null}
    </div>
    <div className="chat-in">
      <textarea className="inp" rows="2" aria-label="ההודעה שלך" placeholder="למשל: יש לי Q♥Q♦‎ בבליינד הגדול, שני לימפים, נשארו לי 250" value=${text}
        onChange=${e => setText(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } }}></textarea>
      ${busy ? html`<button type="button" className="btn fold" style=${{ flex: '0 0 auto' }} onClick=${() => ctl.current && ctl.current.abort()}>עצור</button>`
        : html`<button type="button" className="btn raise" style=${{ flex: '0 0 auto' }} disabled=${!text.trim()} onClick=${() => send()}>שלח</button>`}
    </div>
    ${msgs.length ? html`<div><button type="button" className="linkbtn" onClick=${() => { setMsgs([]); LIVE_MEM.spot = null; LIVE_MEM.lastTitle = null; }}>נקה את הצ׳אט</button></div>` : null}
  </section>`;
}

/* --- the evening: players, buy-ins, re-buy rules, stop-loss --- */
function EveningView({ ev, setEv }){
  const [buying, setBuying] = useState(null);
  const [confirmNew, setConfirmNew] = useState(false);
  const upd = fn => setEv(e => { const n = structuredClone(e); fn(n); return n; });
  const setP = (id, patch) => upd(n => { Object.assign(n.players.find(p => p.id === id), patch); });
  const hero = heroOf(ev), total = tableMoney(ev), R = ev.rules;
  const hr = rebuyInfo(ev, hero);
  const heroNis = hero.stack / ev.cps, heroNet = heroNis + (hero.cashed || 0) - hero.buyIns;
  const doBuy = () => {
    const p = ev.players.find(x => x.id === buying.id), info = rebuyInfo(ev, p);
    const amt = Math.round(numOrNull(buying.amt) || 0);
    if (!info.ok || amt <= 0 || amt > info.max) return;
    upd(n => { const q = n.players.find(x => x.id === p.id); q.buyIns += amt; q.stack += amt * n.cps; n.buys.push({ ts: Date.now(), id: p.id, name: p.name, amt }); });
    setBuying(null);
  };
  const numSet = (path, v) => upd(n => { const x = numOrNull(v); if (x == null || (x <= 0 && path !== 'r.potManual')) return; if (path.startsWith('r.')) n.rules[path.slice(2)] = x; else n[path] = x; });
  return html`<div className="col">
    <section className="panel">
      <h3>הערב שלי</h3>
      <div className="stat-tiles">
        <div className="tile"><div className="lbl">קנית</div><div className="val">${nf(hero.buyIns)} ₪</div><div className="sub">${hero.buyIns * ev.cps} צ׳יפים</div></div>
        <div className="tile"><div className="lbl">בערימה</div><div className="val">${fmt(heroNis)} ₪</div><div className="sub">${hero.stack} צ׳יפים</div></div>
        <div className="tile"><div className="lbl">מאזן</div><div className=${'val ' + (heroNet >= 0 ? 'pos-net' : 'neg-net')}><bdi dir="ltr">${signed(heroNet)}</bdi></div><div className="sub">₪, לפי הערימה עכשיו</div></div>
        <div className="tile"><div className="lbl">עד תקרת ההפסד</div><div className="val">${nf(Math.max(0, hr.lossRoom))} ₪</div><div className="sub">מתוך ${nf(R.stopLoss)} ₪</div></div>
      </div>
      <div className="meter" style=${{ marginTop: '12px' }} aria-label="כמה מתקרת ההפסד כבר בפנים"><div className="zone" style=${{ left: 0, width: Math.min(100, hero.buyIns / R.stopLoss * 100) + '%', background: hero.buyIns >= R.stopLoss * 0.7 ? 'color-mix(in srgb,var(--bad) 45%,transparent)' : undefined }}></div></div>
      <p className="plain">${hr.ok ? `מותר לך לקנות עכשיו עד ${hr.max} ₪.` : `קנייה חוזרת לא מותרת עכשיו: ${hr.why}.`} ${hero.buyIns >= R.stopLoss * 0.7 && hero.buyIns < R.stopLoss ? 'אתה קרוב לתקרה – זה זמן טוב לעצור ולחשוב.' : ''}</p>

/* --- the log: what the advisor said tonight, and what you did --- */
function LiveLog({ ev, setEv, goAsk }){
  const [confirm, setConfirm] = useState(false);
  const upd = (id, patch) => setEv(e => ({ ...e, log: e.log.map(l => l.id === id ? { ...l, ...patch } : l) }));
  const log = [...ev.log].reverse();
  if (!log.length) return html`<section className="panel"><div className="empty">
    <h2>היומן ריק</h2>
    <p>כל שאלה ששאלת את היועץ נשמרת כאן, עם ההמלצה. אחרי היד אפשר לסמן אם עשית מה שהוא אמר ומה יצא – וכך לראות בסוף הערב איפה הוא עזר.</p>
    <button className="linkbtn" onClick=${goAsk}>לשאול שאלה</button>
  </div></section>`;
  const marked = ev.log.filter(l => l.followed != null);
  const sum = arr => arr.reduce((t, l) => t + (numOrNull(l.result) != null ? +l.result : 0), 0);
  const withRes = arr => arr.filter(l => l.result !== '' && l.result != null && isFinite(+l.result));
  const fol = ev.log.filter(l => l.followed === true), nfol = ev.log.filter(l => l.followed === false);
  const time = ts => new Date(ts).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  return html`<div className="col">
    <div className="stat-tiles">
      <div className="tile"><div className="lbl">שאלות הערב</div><div className="val">${ev.log.length}</div><div className="sub">${marked.length} סומנו</div></div>
      <div className="tile"><div className="lbl">עשית כמו היועץ</div><div className="val">${marked.length ? pct(fol.length / marked.length) + '%' : '—'}</div><div className="sub">${fol.length} מתוך ${marked.length}</div></div>
      <div className="tile"><div className="lbl">כשהקשבת</div><div className=${'val ' + (!withRes(fol).length ? '' : sum(fol) >= 0 ? 'pos-net' : 'neg-net')}><bdi dir="ltr">${withRes(fol).length ? signed(sum(fol)) : '—'}</bdi></div><div className="sub">צ׳יפים, ב-${withRes(fol).length} ידיים</div></div>
      <div className="tile"><div className="lbl">כשלא הקשבת</div><div className=${'val ' + (!withRes(nfol).length ? '' : sum(nfol) >= 0 ? 'pos-net' : 'neg-net')}><bdi dir="ltr">${withRes(nfol).length ? signed(sum(nfol)) : '—'}</bdi></div><div className="sub">צ׳יפים, ב-${withRes(nfol).length} ידיים</div></div>
    </div>
    <section className="panel">
      <p className="plain" style=${{ marginTop: 0 }}>זכור: יד אחת היא מזל. גם החלטה נכונה מפסידה לפעמים – שווה להסתכל על התמונה אחרי הרבה ידיים.</p>
      ${log.map(l => html`<div key=${l.id} className="log-item">
        <div className="log-top">
          <span className="mono muted small">${time(l.ts)}</span>
          <${CardRow} cards=${l.cards} />
          ${l.board.length ? html`<${CardRow} cards=${l.board} />` : html`<span className="muted small">לפני הפלופ</span>`}
          <span className="muted small">${POS6_HE[l.pos] || ''} · קופה ${l.pot}${l.toCall ? ` · לשלם ${l.toCall}` : ''}</span>
        </div>
        <div className="log-top"><b className=${'rec-mini ' + recTone(l.act)}><bdi>${l.title}</bdi></b><span className=${'conf ' + l.conf}>${l.conf === 'clear' ? 'ברורה' : 'צמודה'}</span>${l.src === 'chat' ? html`<span className="muted small">מהצ׳אט</span>` : null}</div>
        <div className="log-top">
          <div className="seg sm">
            <button type="button" aria-pressed=${l.followed === true} onClick=${() => upd(l.id, { followed: l.followed === true ? null : true })}>עשיתי את זה</button>
            <button type="button" aria-pressed=${l.followed === false} onClick=${() => upd(l.id, { followed: l.followed === false ? null : false })}>עשיתי אחרת</button>
          </div>
          <div className="num-wrap" style=${{ maxWidth: '230px' }}><input className="inp mono" type="number" inputMode="numeric" step="10" aria-label="כמה צ׳יפים הרווחת או הפסדת ביד" placeholder="רווח או הפסד" value=${l.result} onChange=${e => upd(l.id, { result: e.target.value })} /><span className="muted small">צ׳יפים</span></div>
          <button type="button" className="linkbtn" aria-label="מחק" onClick=${() => setEv(e => ({ ...e, log: e.log.filter(x => x.id !== l.id) }))}>✕</button>
        </div>
      </div>`)}
    </section>
    <div style=${{ display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap' }}>
      ${confirm ? html`<${React.Fragment}><span className="muted">למחוק את כל היומן?</span>
          <button className="linkbtn danger" onClick=${() => { setEv(e => ({ ...e, log: [] })); setConfirm(false); }}>כן, למחוק</button>
          <button className="linkbtn" onClick=${() => setConfirm(false)}>ביטול</button><//>`
        : html`<button className="linkbtn danger" onClick=${() => setConfirm(true)}>מחק את היומן</button>`}
    </div>
  </div>`;
}

const LIVE_SUBS = [['ask', 'שאלה'], ['chat', 'צ׳אט'], ['evening', 'הערב'], ['log', 'יומן']];
function LiveView(){
  const [ev, setEvRaw] = useState(loadEvening);
  const setEv = useCallback(fn => setEvRaw(e => { const n = typeof fn === 'function' ? fn(e) : fn; save(EVE_KEY, n); return n; }), []);
  const [sub, setSub] = useState(LIVE_MEM.sub || 'ask');
  const [result, setResult] = useState(LIVE_MEM.last);
  const [formKey, setFormKey] = useState(0);
  const resRef = useRef(null);
  useEffect(() => { LIVE_MEM.sub = sub; }, [sub]);
  const onResult = useCallback((x, src) => {
    if (src !== 'chat'){ setResult(x); LIVE_MEM.last = x; }
    if (!x){ LIVE_MEM.entry = null; return; }
    const sp = x.sp, again = src === 'form' && LIVE_MEM.entry;
    const entry = { id: again || uid(), ts: Date.now(), src, cards: sp.hero.cards, board: sp.board, pos: sp.hero.pos, pot: sp.pot, toCall: sp.toCall,
      title: x.title, act: x.act, conf: x.conf, followed: null, result: '' };
    if (src === 'form') LIVE_MEM.entry = entry.id;
    setEv(e => {
      const old = e.log.find(l => l.id === entry.id);
      const log = old ? e.log.map(l => l.id === entry.id ? { ...entry, followed: l.followed, result: l.result } : l) : [...e.log, entry].slice(-200);
      return { ...e, log };
    });
    if (src === 'form') setTimeout(() => { if (resRef.current && window.innerWidth < 980) resRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30);
  }, []);
  const openSpot = raw => { LIVE_MEM.form = rawToForm(raw, ev); LIVE_MEM.entry = null; setResult(null); LIVE_MEM.last = null; setFormKey(k => k + 1); setSub('ask'); window.scrollTo({ top: 0 }); };
  const hero = heroOf(ev);
  return html`<div className="col">
    <section className="panel col" style=${{ gap: '12px' }}>
      <div className="scn">
        <h2 className="scn-title">יועץ חי לשולחן הביתי</h2>
        <span className="tag">פתיחה רגילה <b>${ev.norm}</b></span>
        <span className="tag">שולחן <b>${ADV_STYLES[ev.tableStyle] ? ADV_STYLES[ev.tableStyle].he : ''}</b></span>
        <span className="tag">הערימה שלך <b>${hero.stack}</b> · ${fmt(hero.stack / ev.cps)} ₪</span>
      </div>
      <div className="seg subtabs" role="group" aria-label="היועץ">${LIVE_SUBS.map(([k, n]) => html`<button key=${k} type="button" aria-pressed=${sub === k} onClick=${() => setSub(k)}>${n}${k === 'log' && ev.log.length ? ` (${ev.log.length})` : ''}</button>`)}</div>
      <p className="fair">הוגנות: באמצע יד על כסף – רק אם כל השולחן יודע ומסכים. אחרת, השתמש ביועץ בין הידיים ואחרי הערב, כדי ללמוד.</p>
    </section>
    ${sub === 'ask' ? html`<div className="advise">
      <${LiveForm} key=${formKey} ev=${ev} setEv=${setEv} onResult=${onResult} />
      <div ref=${resRef} className="col">${result ? html`<${AdviceCard} x=${result} />` : html`<section className="panel"><div className="empty">
        <h2>מה המצב?</h2>
        <p>בחר את הקלפים שלך (ואת הלוח, אם נפתח), סמן מה קרה ביד, ולחץ "מה לעשות?". תקבל פעולה מדויקת בצ׳יפים ובשקלים, למה, ואיך זה מותאם לשחקנים שמולך.</p>
      </div></section>`}</div>
    </div>` : null}
    ${sub === 'chat' ? html`<${LiveChat} ev=${ev} onResult=${onResult} onOpenSpot=${openSpot} goForm=${() => setSub('ask')} />` : null}
    ${sub === 'evening' ? html`<${EveningView} ev=${ev} setEv=${setEv} />` : null}
    ${sub === 'log' ? html`<${LiveLog} ev=${ev} setEv=${setEv} goAsk=${() => setSub('ask')} />` : null}
  </div>`;
}

/* ----------------------------- Stats ----------------------------- */
function StatsView({ records, onReset, goTo }){
  const [confirm, setConfirm] = useState(false);
  if (!records.length) return html`<section className="panel"><div className="empty">
      <h2>עוד אין נתונים</h2>
      <p>כל החלטה במאמנים ובמשחק מול המחשב נרשמת כאן: אחוז הדיוק, דיוק לפי שלב במשחק, וסוגי הטעויות הנפוצים שלך.</p>
      <div className="btn-row"><button className="linkbtn" onClick=${() => goTo('pre')}>להתחיל ב-Pre-Flop</button><button className="linkbtn" onClick=${() => goTo('sim')}>לשחק מול המחשב</button></div>
    </div></section>`;
  const t = records.length;
  const good = records.filter(r => r.grade !== 'mistake').length;
  const best = records.filter(r => r.grade === 'best').length;
  let streak = 0; for (let i = t - 1; i >= 0 && records[i].grade !== 'mistake'; i--) streak++;
  const last50 = records.slice(-50);
  const acc50 = last50.filter(r => r.grade !== 'mistake').length / last50.length;
  const byStreet = STREETS.map(([k, n]) => { const rs = records.filter(r => r.street === k); return { k, n, t: rs.length, a: rs.length ? rs.filter(r => r.grade !== 'mistake').length / rs.length : 0 }; });
  const mcount = {};
  records.forEach(r => { if (r.mtype) mcount[r.mtype] = (mcount[r.mtype] || 0) + 1; });
  const mlist = Object.entries(mcount).sort((a, b) => b[1] - a[1]);
  const maxM = mlist.length ? mlist[0][1] : 1;
  const recentMistakes = records.filter(r => r.grade === 'mistake').slice(-8).reverse();
  const worstStreet = byStreet.filter(s => s.t >= 3).sort((a, b) => a.a - b.a)[0];
  const accColor = a => a >= 0.8 ? 'var(--good)' : a >= 0.6 ? 'var(--brass)' : 'var(--bad)';
  return html`<div className="col">
    <div className="stat-tiles">
      <div className="tile"><div className="lbl">Accuracy</div><div className="val" style=${{ color: accColor(good / t) }}>${pct(good / t)}%</div><div className="sub">החלטות נכונות או סבירות</div></div>
      <div className="tile"><div className="lbl">החלטה מיטבית</div><div className="val">${pct(best / t)}%</div><div className="sub">בדיוק הפעולה המומלצת</div></div>
      <div className="tile"><div className="lbl">50 אחרונות</div><div className="val">${pct(acc50)}%</div><div className="sub">${acc50 > good / t ? 'מגמת שיפור ↑' : acc50 < good / t ? 'ירידה קלה ↓' : 'יציב'}</div></div>
      <div className="tile"><div className="lbl">רצף נוכחי</div><div className="val">${streak}</div><div className="sub">מתוך ${t} החלטות</div></div>
    </div>
    <section className="panel">
      <h3>40 ההחלטות האחרונות</h3>
      <div className="ticks">${records.slice(-40).map((r, i) => html`<i key=${i} title=${r.text} style=${{ background: r.grade === 'best' ? 'var(--good)' : r.grade === 'ok' ? 'var(--okc)' : 'var(--bad)' }}></i>`)}</div>
      <div className="legend" style=${{ marginTop: '8px' }}><span><i style=${{ background: 'var(--good)' }}></i>מיטבית</span><span><i style=${{ background: 'var(--okc)' }}></i>סבירה</span><span><i style=${{ background: 'var(--bad)' }}></i>טעות</span></div>
    </section>
    <div className="two-col">
      <section className="panel">
        <h3>דיוק לפי שלב במשחק</h3>
        <div className="bars">${byStreet.map(s => html`<div key=${s.k} className="barrow">
          <span>${s.n}</span>
          <span className="track"><i style=${{ width: (s.t ? pct(s.a) : 0) + '%', background: accColor(s.a) }}></i></span>
          <span className="num">${s.t ? pct(s.a) + '%' : '—'} · ${s.t}</span>
        </div>`)}</div>
        ${worstStreet ? html`<p className="plain" style=${{ marginTop: '12px' }}>השלב החלש ביותר כרגע: <b style=${{ color: 'var(--text)' }}>${worstStreet.n}</b> (${pct(worstStreet.a)}%). כדאי לתרגל אותו ממוקד.</p>` : null}
      </section>
      <section className="panel">
        <h3>טעויות נפוצות</h3>
        ${mlist.length ? html`<div className="bars">${mlist.map(([k, n]) => html`<div key=${k} className="barrow">
            <span>${MISTAKES[k].label}</span>
            <span className="track"><i style=${{ width: (n / maxM * 100) + '%', background: 'var(--bad)' }}></i></span>
            <span className="num">${n}</span>
          </div>`)}</div>
          <p style=${{ fontSize: '13.5px', margin: '12px 0 0' }}><b style=${{ color: 'var(--brass)' }}>טיפ: </b>${rich(MISTAKES[mlist[0][0]].tip)}</p>`
          : html`<p className="muted">אין טעויות עדיין. יפה!</p>`}
      </section>
    </div>
    <section className="panel">
      <h3>טעויות אחרונות</h3>
      ${recentMistakes.length ? html`<ul className="mlist">${recentMistakes.map((r, i) => html`<li key=${i}><b>${MISTAKES[r.mtype] ? MISTAKES[r.mtype].label : ''}</b><div className="muted">${r.text}</div></li>`)}</ul>` : html`<p className="muted">אין טעויות להצגה.</p>`}
    </section>
    <div style=${{ display: 'flex', gap: '10px', alignItems: 'center', flexWrap: 'wrap' }}>
      ${confirm ? html`<${React.Fragment}><span className="muted">למחוק את כל הסטטיסטיקה?</span>
          <button className="linkbtn danger" onClick=${() => { onReset(); setConfirm(false); }}>כן, למחוק</button>
          <button className="linkbtn" onClick=${() => setConfirm(false)}>ביטול</button><//>`
        : html`<button className="linkbtn danger" onClick=${() => setConfirm(true)}>איפוס סטטיסטיקה</button>`}
    </div>
  </div>`;
}

/* ----------------------------- App ----------------------------- */
const STORE_KEY = 'felt-lab-stats-v1';
const PREF_KEY = 'felt-lab-prefs-v1';
function load(key, fallback){ try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e){ return fallback; } }
function save(key, v){ try { localStorage.setItem(key, JSON.stringify(v)); } catch (e){} }
const TABS = [['learn','מדריך'],['live','יועץ חי'],['pre','Pre-Flop'],['post','Post-Flop'],['sim','משחק מול המחשב'],['range','טווחים'],['stats','התקדמות']];
function TermSheet({ i, onClose }){
  useEffect(() => {
    const f = e => { if (e.key === 'Escape') onClose(); };
    const c = () => onClose();
    window.addEventListener('keydown', f);
    window.addEventListener('click', c);
    return () => { window.removeEventListener('keydown', f); window.removeEventListener('click', c); };
  }, [i]);
  const g = GLOSS[i];
  return html`<div className="sheet" role="dialog" aria-label=${g.t} onClick=${e => e.stopPropagation()}>
    <button className="close" type="button" aria-label="סגירה" onClick=${onClose}>✕</button>
    <h4>${g.t}</h4><p>${g.d}</p>${g.e ? html`<p className="ex">לדוגמה: ${g.e}</p>` : null}
  </div>`;
}
function App(){
  const prefs = load(PREF_KEY, {});
  const [tab, setTab] = useState(TABS.some(t => t[0] === prefs.tab) ? prefs.tab : 'learn');
  const [intuition, setIntuition] = useState(!!prefs.intuition);
  const [records, setRecords] = useState(() => load(STORE_KEY, []));
  const [term, setTerm] = useState(null);
  useEffect(() => { const p = load(PREF_KEY, {}); save(PREF_KEY, { ...p, tab, intuition }); }, [tab, intuition]);
  const record = useCallback(r => setRecords(rs => { const n = [...rs, { ...r, ts: Date.now() }].slice(-1000); save(STORE_KEY, n); return n; }), []);
  const reset = () => { setRecords([]); save(STORE_KEY, []); };
  const goTo = t => { setTab(t); window.scrollTo({ top: 0 }); };
  const good = records.filter(r => r.grade !== 'mistake').length;
  return html`<${TermCtx.Provider} value=${setTerm}><div className="app">
    <header className="top">
      <div className="brand"><div className="logo" aria-hidden="true"></div>
        <div><h1>Felt <span>Lab</span></h1><small>מאמן Texas Hold'em · קאש ⁦6-Max⁩ · 100bb</small></div></div>
      <nav className="tabs" role="tablist">${TABS.map(([k, n]) => html`<button key=${k} role="tab" aria-selected=${tab === k} onClick=${() => goTo(k)}>${n}</button>`)}</nav>
      <div className="hdr-right">
        ${(tab === 'pre' || tab === 'post') ? html`<label className="switch" title="הסתר אחוזים עד אחרי ההחלטה"><input id="intuition" type="checkbox" checked=${intuition} onChange=${e => setIntuition(e.target.checked)} />מצב אינטואיציה</label>` : null}
        <span className="acc-pill">דיוק <b>${records.length ? pct(good / records.length) + '%' : '—'}</b> · ${records.length} החלטות</span>
      </div>
    </header>
    <main>
      ${tab === 'learn' ? html`<${LearnView} goTo=${goTo} />` : null}
      ${tab === 'live' ? html`<${LiveView} />` : null}
      ${tab === 'pre' ? html`<${PreflopTrainer} record=${record} intuition=${intuition} />` : null}
      ${tab === 'post' ? html`<${PostflopTrainer} record=${record} intuition=${intuition} />` : null}
      ${tab === 'sim' ? html`<${SimView} record=${record} />` : null}
      ${tab === 'range' ? html`<${RangeExplorer} />` : null}
      ${tab === 'stats' ? html`<${StatsView} records=${records} onReset=${reset} goTo=${goTo} />` : null}
    </main>
    <p className="foot">מונח עם קו מנוקד – לחץ עליו להסבר. קיצורי מקלדת: F = Fold · C = Check/Call · R/B = Raise/Bet · N = יד הבאה. ההמלצות מבוססות על טווחי בסיס מפושטים וחישובי Equity מול טווח משוער – כלי לימוד, לא Solver. גם היועץ החי הוא הערכה של מודל – ההחלטה תמיד שלך.</p>
  </div>
  ${term != null ? html`<${TermSheet} i=${term} onClose=${() => setTerm(null)} />` : null}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
